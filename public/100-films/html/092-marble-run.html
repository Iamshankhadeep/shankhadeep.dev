/* Nº 092 — MARBLE RUN
 * A marble rolls through a toy track whose chimes and blocks play the tune. The track was laid out backwards

 * constant speed strikes them in eighth-notes, a bumper, then a staircase of thirteen xylophone keys whose

    if (b >= CUP.t - 0.2) { const wob = ring(CUP.t, 3) * Math.sin((t - bt(CUP.t)) * 20) * 3; c.fillStyle = '#8fcfc0'; c.beginPath(); c.moveTo(CUP.x - 46 + wob, CUP.y - 37); c.lineTo(CUP.x + 46 + wob, CUP.y - 37); c.lineTo(CUP.x + 34, CUP.y + 34); c.quadraticCurveTo(CUP.x, CUP.y + 44, CUP.x - 34, CUP.y + 34); c.closePath(); c.fill(); c.strokeStyle = '#6fb5a5'; c.lineWidth = 4; c.beginPath(); c.ellipse(CUP.x + wob, CUP.y - 40, 46, 9, 0, 0, Math.PI); c.stroke(); }
    // beat counter
    const on = prog(t, 0.6, 0.6) * (1 - prog(t, 22.6, 1)); c.font = '500 13px "JetBrains Mono Variable"'; c.textAlign = 'left'; c.textBaseline = 'alphabetic'; c.fillStyle = `rgba(44,62,58,${0.5 * on})`; c.fillText('B E A T   ' + String(Math.min(40, Math.floor(b) + 1)).padStart(2, '0') + '  /  4 0', 1500, 1040);
  }
});
