<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nº 028 — Four Seasons</title>
<link rel="stylesheet" href="../lib/fonts/fonts.css">
<script src="../lib/stage.js"></script>
<script src="../lib/synth.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
/* Nº 028 — FOUR SEASONS
 * 春 夏 秋 冬 — four characters, four weathers, two bars each (eight bars at 96 bpm, five seconds a season).
 * Petals, sun flecks, leaves and snow pass both behind and in front of the glyph; each season's weather drifts
 * on into the next as a diagonal wipe, in the direction of the wind, changes the page. */
const { ease: E, prog, win, clamp01, lerp, smoothstep, hash } = Stage;
const W = 1920, H = 1080, TAU = Math.PI * 2, SEASON = 5, GX = 960, GY = 470;
const S4 = [
  { ch: '春', en: 'SPRING', ro: 'haru', bg: ['#f8e6e4', '#f1c6cf'], ink: '#57283a', sub: 'rgba(87,40,58,.7)' },
  { ch: '夏', en: 'SUMMER', ro: 'natsu', bg: ['#0d3327', '#1d5c40'], ink: '#eef3d6', sub: 'rgba(238,243,214,.75)' },
  { ch: '秋', en: 'AUTUMN', ro: 'aki', bg: ['#cf6220', '#8a2f0e'], ink: '#fbe6c8', sub: 'rgba(251,230,200,.8)' },
  { ch: '冬', en: 'WINTER', ro: 'fuyu', bg: ['#e6edf5', '#b4c5db'], ink: '#1b2b47', sub: 'rgba(27,43,71,.7)' }
];
let ctx, glyphs = [];

function particles(c, k, t, front, alpha) {
  if (alpha <= 0) return;
  const n = [150, 60, 110, 190][k];
  for (let i = front ? 0 : 1; i < n; i += 2) {
    const h1 = hash(i, 10 + k), h2 = hash(i, 20 + k), h3 = hash(i, 30 + k), depth = front ? 0.6 + 0.4 * h3 : 0.15 + 0.45 * h3;
    c.globalAlpha = alpha * (front ? 0.95 : 0.7);
    if (k === 0) {            // petals: tumbling down and to the right
      const sp = 150 + 170 * depth, u = Stage.mod(h1 * 1500 + t * sp, H + 240) - 120, x = Stage.mod(h2 * 2400 + t * sp * 0.55 + 60 * Math.sin(t * 1.3 + i), W + 300) - 150, s = 9 + 15 * depth;
      c.save(); c.translate(x, u); c.rotate(t * (1.2 + h3) + i); c.scale(1, 0.35 + 0.65 * Math.abs(Math.sin(t * (1.7 + h1) + i)));
      c.fillStyle = h3 > 0.5 ? '#f7b7c6' : '#fff1f3'; c.beginPath(); c.moveTo(0, -s); c.bezierCurveTo(s * 0.9, -s * 0.7, s * 0.8, s * 0.6, 0, s); c.bezierCurveTo(-s * 0.8, s * 0.6, -s * 0.9, -s * 0.7, 0, -s); c.fill(); c.restore();
    } else if (k === 1) {     // sun flecks through leaves: soft discs rising slowly
      const y = H + 150 - Stage.mod(h1 * 1400 + t * (26 + 50 * depth), H + 300), x = h2 * W + 50 * Math.sin(t * 0.5 + i), r = 26 + 90 * depth * h3;
      const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(226,240,150,.34)'); g.addColorStop(0.7, 'rgba(190,226,120,.12)'); g.addColorStop(1, 'rgba(190,226,120,0)'); c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
      if (i % 3 === 0) { const fx = Stage.mod(h2 * 3000 + 90 * Math.sin(t * 0.7 + i * 2), W), fy = 200 + h1 * 700 + 60 * Math.sin(t * 0.9 + i), tw = 0.5 + 0.5 * Math.sin(t * (2 + h3 * 2) + i); c.fillStyle = `rgba(240,250,170,${0.9 * tw})`; c.beginPath(); c.arc(fx, fy, 2.2 + 1.5 * depth, 0, TAU); c.fill(); }
    } else if (k === 2) {     // leaves: tumbling on a gusty wind
      const sp = 260 + 240 * depth, x = Stage.mod(h2 * 2600 + t * sp + 80 * Math.sin(t * 2 + i), W + 300) - 150, y = Stage.mod(h1 * 1500 + t * sp * 0.42 + 50 * Math.sin(t * 1.6 + i * 3), H + 240) - 120, s = 12 + 20 * depth;
      c.save(); c.translate(x, y); c.rotate(t * (2 + 2 * h3) + i); c.scale(1, 0.3 + 0.7 * Math.abs(Math.cos(t * (2.2 + h1) + i)));
      c.fillStyle = ['#f6c13a', '#e8862a', '#b8301a', '#7c1d10'][i % 4]; c.beginPath();
      for (let q = 0; q < 10; q++) { const a = q / 10 * TAU - Math.PI / 2, rr = q % 2 ? s * 0.45 : s * (q === 0 ? 1.25 : 1); q ? c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : c.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      c.closePath(); c.fill(); c.fillRect(-1, s * 0.7, 2, s * 0.7); c.restore();
    } else {                  // snow: slow, swaying, soft
      const sp = 60 + 110 * depth, y = Stage.mod(h1 * 1400 + t * sp, H + 100) - 50, x = Stage.mod(h2 * 2200 + 40 * Math.sin(t * 0.8 + i) + t * 14, W + 100) - 50, r = 2 + 9 * depth * depth * (front ? 1.6 : 1);
      const g = c.createRadialGradient(x, y, 0, x, y, r * 1.8); g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(0.5, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(x - r * 2, y - r * 2, r * 4, r * 4);
    }
  }
  c.globalAlpha = 1;
}

function scene(c, k, t, lt) {       // lt = time since this season began
  const s = S4[k], g = c.createLinearGradient(0, 0, W * 0.3, H); g.addColorStop(0, s.bg[0]); g.addColorStop(1, s.bg[1]); c.fillStyle = g; c.fillRect(0, 0, W, H);
  const rg = c.createRadialGradient(GX, GY, 80, GX, GY, 900); rg.addColorStop(0, 'rgba(255,255,255,.14)'); rg.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = rg; c.fillRect(0, 0, W, H);
  particles(c, k, t, false, 1);
  // the character: rises a little and settles; summer shimmers in the heat
  const a = prog(lt, 0.15, 1.2, E.outExpo), gl = glyphs[k], y0 = GY - gl.h / 2 + (1 - a) * 40 - 6 * prog(lt, 0, 5, E.inOutSine);
  c.globalAlpha = clamp01(a * 1.2);
  if (k === 1) { const strips = 54, sh = gl.h / strips; for (let q = 0; q < strips; q++) c.drawImage(gl.img, 0, q * sh * 2, gl.w * 2, sh * 2 + 1, GX - gl.w / 2 + 5 * Math.sin(t * 2.4 + q * 0.42) * smoothstep(0, 1, q / strips), y0 + q * sh, gl.w, sh + 0.6); }
  else c.drawImage(gl.img, GX - gl.w / 2, y0, gl.w, gl.h);
  c.globalAlpha = 1;
  // names
  const la = prog(lt, 0.7, 1.0, E.outCubic);
  c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.fillStyle = s.ink; c.globalAlpha = la; c.font = '500 26px "JetBrains Mono Variable"'; c.fillText(s.en.split('').join('   '), GX, 872 + (1 - la) * 14);
  c.fillStyle = s.sub; c.font = 'italic 400 34px "Fraunces Variable"'; c.fillText(s.ro, GX, 924 + (1 - la) * 14);
  c.fillRect(GX - 30, 826, 60 * la, 1.5); c.globalAlpha = 1;
  particles(c, k, t, true, 1);
}

Stage.create({
  no: 28, title: 'Four Seasons', subtitle: '春 夏 秋 冬 · 96 bpm',
  duration: 20, background: '#f8e6e4', grain: 0.055, poster: 12.4,
  fonts: ['400 600px "Noto Serif JP Variable"', '500 26px "JetBrains Mono Variable"', 'italic 400 34px "Fraunces Variable"'],
  fade: { in: 0.8, out: 1.4, inColor: '#f8e6e4', outColor: '#dfe8f2' },
  slate: { at: 0.7, hold: 2.6, color: 'rgba(87,40,58,.85)' },

  music(S) {
    const M = S.score({ bpm: 96, duration: 20, seed: 28 });
    M.master({ reverb: { decay: 3.0, size: 1.1, damp: 0.45 }, fadeOut: 2.2 });
    const koto = M.track('koto', { reverb: 0.45, gain: 1.0, delay: { time: 1.5, fb: 0.22, mix: 0.16 } }), harp = M.track('harp', { reverb: 0.5, gain: 0.7 });
    const flute = M.track('flute', { reverb: 0.6, gain: 0.7 }), pad = M.track('warmpad', { reverb: 0.6, gain: 0.5 }), chime = M.track('chime', { reverb: 0.8, gain: 0.5, delay: { time: 0.75, fb: 0.4, mix: 0.3 } });
    const sub = M.track('sub', { reverb: 0.05, gain: 0.5 }), wh = M.track('whoosh', { reverb: 0.4, gain: 0.4 }), tom = M.track('tom', { reverb: 0.5, gain: 0.5, params: { tone: 80, decay: 0.5 } });
    // D yo scale: D E G A B. One theme, four dressings.
    const theme = ['D5', 'E5', 'G5', null, 'A5', 'G5', 'E5', null, 'D5', null, 'B4', 'A4', null, 'B4', 'D5', null];
    // spring — bright and quick
    koto.seq(0, 0.5, theme, { vel: 0.6, gate: 1.6 }); pad.chord(0, ['D3', 'A3', 'E4'], 8, 0.5); harp.arp(4, ['D4', 'E4', 'A4', 'B4'], 0.5, 4, { vel: 0.35, mode: 'up' });
    // summer — lush: flute takes the theme, koto answers, bass arrives
    flute.seq(8, 1, ['A5', '-', 'G5', 'E5', 'D5', '-', 'E5', '-'], { vel: 0.55 }); koto.seq(8, 0.5, [null, 'D4', null, 'A4', null, 'D5', 'B4', null, null, 'G4', null, 'B4', null, 'E5', 'D5', null], { vel: 0.5, gate: 1.6 });
    pad.chord(8, ['G2', 'D3', 'B3', 'E4'], 8, 0.62); sub.note(8, 'G1', 7.5, 0.7); harp.arp(8, ['G3', 'B3', 'D4', 'E4', 'A4'], 0.25, 8, { vel: 0.26, mode: 'updown' });
    // autumn — sparse, falling
    koto.seq(16, 1, ['B5', 'A5', 'G5', 'E5', 'D5', null, 'B4', 'A4'], { vel: 0.62, gate: 2 }); pad.chord(16, ['E3', 'B3', 'G4'], 8, 0.5); sub.note(16, 'E1', 7.5, 0.6); tom.hit(16, 0.8); tom.hit(20, 0.5);
    // winter — still
    koto.seq(24, 2, ['D5', 'A4', 'E5', 'D5'], { vel: 0.5, gate: 2 }); pad.chord(24, ['D3', 'A3', 'D4'], 8, 0.42); sub.note(24, 'D1', 8, 0.5);
    const r = S.rng(4), yo = S.scale('D6', 'yo', 1); for (let b = 24.5; b < 31.5; b += 0.5) if (r() < 0.5) chime.note(b, yo[(r() * 5) | 0], 1, 0.2 + 0.2 * r());
    [8, 16, 24].forEach((b) => wh.hit(b - 1.2, 0.7, 2.4));
    return M;
  },

  setup() {
    ctx = Stage.canvas2d({ z: 1 });
    for (const s of S4) { const m = Stage.buffer(10, 10); m.font = '400 600px "Noto Serif JP Variable"'; const tm = m.measureText(s.ch), w = Math.ceil(tm.width) + 40, h = Math.ceil(tm.actualBoundingBoxAscent + tm.actualBoundingBoxDescent) + 40; const b = Stage.buffer(w * 2, h * 2); b.scale(2, 2); b.font = '400 600px "Noto Serif JP Variable"'; b.fillStyle = s.ink; b.textBaseline = 'alphabetic'; b.fillText(s.ch, 20, 20 + tm.actualBoundingBoxAscent); glyphs.push({ img: b.canvas, w, h }); }
  },

  frame(t) {
    const c = ctx, k = Math.min(3, Math.floor(t / SEASON)), lt = t - k * SEASON;
    scene(c, k, t, lt);
    // the page turns with the wind: the next season wipes in diagonally over the last 0.45 s and first 0.45 s
    if (k < 3 && lt > SEASON - 0.45) {
      const u = prog(lt, SEASON - 0.45, 0.9, E.inOutCubic), x = -500 + (W + 1000) * u;
      c.save(); c.beginPath(); c.moveTo(-10, -10); c.lineTo(x + 260, -10); c.lineTo(x - 260, H + 10); c.lineTo(-10, H + 10); c.closePath(); c.clip(); scene(c, k + 1, t, lt - SEASON); c.restore();
    } else if (k > 0 && lt < 0.45) {
      const u = prog(lt, -0.45, 0.9, E.inOutCubic), x = -500 + (W + 1000) * u;
      c.save(); c.beginPath(); c.moveTo(x + 260, -10); c.lineTo(W + 10, -10); c.lineTo(W + 10, H + 10); c.lineTo(x - 260, H + 10); c.closePath(); c.clip(); scene(c, k - 1, t, lt + SEASON); c.restore();
    }
    // last season's weather lingers for a moment over the new page
    if (k > 0 && lt < 1.6) particles(c, k - 1, t, true, 1 - prog(lt, 0.3, 1.3, E.inOutSine));
  }
});
</script>
</body>
</html>
