/* Nº 078 — MOVEMENT
 * A mechanical watch movement assembles itself and starts to tick. The going train is real arithmetic:
 * barrel 84 → centre pinion 12 · centre wheel 64 → third pinion 8 · third wheel 60 → fourth pinion 8 ·
 * fourth wheel 48 → escape pinion 12 · escape wheel 15 teeth. All teeth share one pitch, every pair sits at
 * the sum of its pitch radii, and each gear's angle is derived from its neighbour's so teeth always fall in
 * gaps. The balance swings at 1 Hz; each pass is a tick (2 Hz — the film's drum kit), the escape wheel
 * advances 12°, so the fourth wheel turns 6°/s (a true seconds hand) and the centre wheel once an hour.
 * Parts seat on the beat through bars 1–6; the first tick is the downbeat of bar 7. Ten bars at 120 bpm. */
const { ease: E, prog, win, clamp01, lerp, smoothstep, hash } = Stage;
const W = 1920, H = 1080, TAU = Math.PI * 2, CX = 960, CY = 540, PR = 404, MOD = 0.7, T_RUN = 12, T_DIAL = 16;
const R_ = (n) => n / MOD;                                   // pitch radius for n teeth (px)
const pol = (p, d, a) => [p[0] + d * Math.cos(a), p[1] + d * Math.sin(a)];
// arbors: positions follow from the meshing distances
const P_C = [0, 0], A_CB = 3.75, P_B = pol(P_C, R_(12) + R_(84), A_CB), A_C3 = -0.72, P_3 = pol(P_C, R_(64) + R_(8), A_C3), A_34 = 1.02, P_4 = pol(P_3, R_(60) + R_(8), A_34), A_4E = 1.78, P_E = pol(P_4, R_(48) + R_(12), A_4E);
const P_BAL = [P_E[0] - 86, P_E[1] + 128], P_PAL = [lerp(P_E[0], P_BAL[0], 0.44), lerp(P_E[1], P_BAL[1], 0.44) + 6];
const mesh = (thA, nA, nB, phi) => phi + Math.PI - (TAU / nB) * (0.5 - (phi - thA) * nA / TAU);
const BRASS = ['#f0d08a', '#c79a45', '#7d5c22'], STEEL = ['#eef1f5', '#aab1bc', '#5f6672'];
// parts: seat time (s), exploded offset
const PARTS = { plate: [1.0, [0, 0]], barrel: [2.0, [-640, -210]], ratchet: [2.5, [-560, 300]], centre: [3.0, [620, -300]], third: [4.0, [700, 40]], fourth: [5.0, [560, 330]], escape: [6.0, [-700, 60]], pallet: [7.0, [-420, 380]], balance: [8.0, [300, 420]], cock: [9.0, [690, -120]] };
let bg, ctx, plateBuf, dialBuf;

function gear(c, x, y, n, ang, o = {}) {
  const R = R_(n), h = o.h || 6.2, r0 = R - h * 0.62, r1 = R + h * 0.5, col = o.col || BRASS, tw = TAU / n;
  c.save(); c.translate(x, y);

  c.beginPath(); for (let i = 0; i < n; i++) { const a = ang + i * tw; c.lineTo(r0 * Math.cos(a - tw * 0.27), r0 * Math.sin(a - tw * 0.27)); c.lineTo(r1 * Math.cos(a - tw * 0.13), r1 * Math.sin(a - tw * 0.13)); c.lineTo(r1 * Math.cos(a + tw * 0.13), r1 * Math.sin(a + tw * 0.13)); c.lineTo(r0 * Math.cos(a + tw * 0.27), r0 * Math.sin(a + tw * 0.27)); } c.closePath();

  c.strokeStyle = 'rgba(40,24,6,.35)'; c.lineWidth = 0.8; c.stroke();

function pinion(c, x, y, n, ang) { gear(c, x, y, n, ang, { col: STEEL, solid: true, h: 5.4 }); }

Stage.create({

  music(S) {

  },

  setup() {

  frame(t) {

    place('third', () => { gear(c, P_3[0], P_3[1], 60, th3, { spokes: 5 }); pinion(c, P_3[0], P_3[1], 8, th3); });

      screw(c, lerp(P_BAL[0], foot[0], 0.9), lerp(P_BAL[1], foot[1], 0.9), 13, 1.1); c.strokeStyle = 'rgba(30,34,48,.7)'; c.lineWidth = 1.2; for (let i = -3; i <= 3; i++) { const a = -1.9 + i * 0.09; c.beginPath(); c.moveTo(P_BAL[0] + 30 * Math.cos(a), P_BAL[1] + 30 * Math.sin(a)); c.lineTo(P_BAL[0] + 36 * Math.cos(a), P_BAL[1] + 36 * Math.sin(a)); c.stroke(); } });
    // jewels and blued screws pop in last
    [P_C, P_3, P_4, P_E, P_PAL, P_BAL, [P_B[0] + 70, P_B[1] - 150]].forEach((p, k) => { const a = E.outBack(prog(t, 9.5 + k * 0.25 - 0.18, 0.3)); if (a > 0 && k < 6) jewel(c, p[0], p[1], (k === 5 ? 10 : 8) * a, Math.min(1, a)); });

      const sec = (35 + (run ? step * 0.5 : 0)) / 60 * TAU; c.save(); c.rotate(sec); c.strokeStyle = '#c8321e'; c.lineWidth = 2.6; c.lineCap = 'round'; c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 6; c.shadowOffsetY = 4; c.beginPath(); c.moveTo(0, 70); c.lineTo(0, -352); c.stroke(); c.fillStyle = '#c8321e'; c.beginPath(); c.arc(0, 52, 9, 0, TAU); c.fill(); c.restore();

    c.restore();
    // a small readout: the train's arithmetic
    const on = prog(t, 3.2, 1.0) * (1 - prog(t, T_DIAL - 0.2, 0.8)); if (on > 0) { c.font = '500 13px "JetBrains Mono Variable"'; c.textAlign = 'right'; c.textBaseline = 'alphabetic'; const lines = [['B A R R E L   8 4 : 1 2', 2.0], ['C E N T R E   6 4 : 8', 3.0], ['T H I R D   6 0 : 8', 4.0], ['F O U R T H   4 8 : 1 2', 5.0], ['E S C A P E   1 5   ·   7 2 0 0   B P H', 6.0]]; lines.forEach(([s, T], i) => { const a = prog(t, T, 0.5, E.outCubic); c.fillStyle = `rgba(190,205,240,${0.62 * on * a})`; c.fillText(s, W - 90, H - 180 + i * 22); }); }
