<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nº 004 — Cloud Chamber</title>
<link rel="stylesheet" href="../lib/fonts/fonts.css">
<script src="../lib/stage.js"></script>
<script src="../lib/synth.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
/* Nº 004 — CLOUD CHAMBER
 * A slow flight through a canyon of cumulus at golden hour: a raymarched density field with a short light march
 * toward the sun at every sample. Eight bars at 80 bpm (3 s each). The camera threads two towers, passes through
 * a thin veil, and on the downbeat of bar 6 (15.0 s) the sun flares through the gap; then it climbs above the deck.
 * The volume is marched at 0.6× resolution into a float buffer and upsampled — clouds are soft, the saving is 3×. */
const { ease: E, prog, clamp01, lerp, smoothstep } = Stage;
const FLARE = 15.0;

const MARCH = `
uniform vec3 uRo, uFw, uSun; uniform float uFlare, uOpen;
float h3(vec3 p){ p = fract(p * .3183099 + .1); p *= 17.; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float vn(vec3 x){ vec3 i = floor(x), f = fract(x); f = f * f * (3. - 2. * f);
  return mix(mix(mix(h3(i), h3(i + vec3(1,0,0)), f.x), mix(h3(i + vec3(0,1,0)), h3(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), f.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), f.x), f.y), f.z); }
float pathX(float z){ return 1.6 * sin(z * .085) + .7 * sin(z * .21 + 1.3); }
// density: billows × vertical profile, a corridor carved along the flight path, one thin veil across it
float dens(vec3 p, int oct){
  vec3 q = p * .5 + vec3(0., 0., uTime * .05);
  float n = 0., a = .5, s = 0.;
  for (int i = 0; i < oct; i++) { n += a * vn(q); s += a; q = q * 2.03 + vec3(7.1, 3.3, 1.7); a *= .5; }
  n /= s;
  if (oct > 3) n -= .085 * (1. - vn(p * 2.7 + vec3(0., uTime * .06, 0.))) + .04 * (1. - vn(p * 6.1));   // wispy erosion of the edges
  float big = vn(vec3(p.xz * .11, 3.7));
  float dx = abs(p.x - pathX(p.z));
  float top = 1.2 + 3.6 * smoothstep(.30, .78, big) + 3.2 * exp(-pow((dx - 3.6) / 1.9, 2.));   // towers flank the corridor
  float prof = smoothstep(top, top - 2.2, p.y) * smoothstep(-2.6, -1.2, p.y);
  float corridor = smoothstep(.7, 2.6, dx + .35 * max(p.y - 1.4, 0.) - .9 * max(-.6 - p.y, 0.));
  float wall = exp(-pow((p.z - 47.) / 3.4, 2.)) * smoothstep(10., 6.5, p.y) * smoothstep(-2.6, -1.2, p.y);   // the veil across the path, tall enough to hide the sun
  float open = smoothstep(52., 66., p.z) * uOpen;                 // beyond the veil the towers thin into a deck below
  prof *= mix(1., smoothstep(.6, -1.4, p.y), open);
  return clamp((n * max(prof * (.10 + .90 * corridor), wall * .92) - .262) * 3.3, 0., 1.);
}
void main(){
  vec2 p = (gl_FragCoord.xy - .5 * uRes) / uRes.y;
  vec3 fw = normalize(uFw), rt = normalize(cross(fw, vec3(0,1,0))), up = cross(rt, fw);
  vec3 rd = normalize(fw * 1.35 + rt * p.x + up * p.y);
  float mu = dot(rd, uSun);
  // sky: warm at the horizon and toward the sun, soft periwinkle above
  vec3 sky = mix(vec3(1., .76, .62), vec3(.34, .52, .90), smoothstep(-.06, .62, rd.y));
  sky = mix(sky, vec3(.99, .66, .66), smoothstep(.0, -.5, rd.y) * .7);            // hazy lilac-peach floor far below
  sky = mix(sky, vec3(1., .86, .66), pow(max(mu, 0.), 6.) * .7);
  sky += vec3(1., .78, .50) * (pow(max(mu, 0.), 90.) * 1.2 + pow(max(mu, 0.), 900.) * 6.) * (.55 + .9 * uFlare);
  vec3 sunC = vec3(1.0, .62, .34) * 3.1, ambT = vec3(.50, .58, .98), ambB = vec3(.40, .30, .52);
  float jit = hash21(gl_FragCoord.xy + 37. * fract(uTime * .618));
  float t = .3 + jit * .5, T = 1.; vec3 col = vec3(0.);
  for (int i = 0; i < 88; i++) {
    if (T < .015 || t > 62.) break;
    vec3 pos = uRo + rd * t;
    float d = dens(pos, 5);
    float st = max(.15, t * .032);
    if (d > .004) {
      float ld = 0.;                                               // light march toward the sun
      for (int j = 1; j <= 5; j++) ld += dens(pos + uSun * (float(j) * .42), 3);
      float beer = exp(-ld * .95), powder = 1. - exp(-d * 5.);
      float ph = .55 + 1.6 * pow(max(mu, 0.), 6.) + .5 * pow(max(mu, 0.), 40.);   // forward scatter: silver linings
      vec3 lit = sunC * beer * mix(powder, 1., .35) * ph + mix(ambB, ambT, clamp(pos.y * .25 + .5, 0., 1.)) * .62;
      lit = mix(lit, sky, 1. - exp(-t * .028));                    // aerial perspective
      float a = 1. - exp(-d * st * 2.1);
      col += T * a * lit; T *= 1. - a;
    }
    t += st * (d > .004 ? .75 : 1.25);
  }
  col += sky * T;
  // crepuscular shafts: brighter where little cloud stands between the eye and the sun
  col += vec3(1., .74, .46) * pow(max(mu, 0.), 12.) * T * uFlare * .35;
  fragColor = vec4(col, 1.);
}`;
const DISPLAY = `
uniform float uExpose;
void main(){
  vec2 px = 1. / vec2(textureSize(uState, 0));
  vec3 c = texture(uState, vUv).rgb * .5 + .125 * (texture(uState, vUv + px * vec2(1,1)).rgb + texture(uState, vUv + px * vec2(-1,1)).rgb + texture(uState, vUv + px * vec2(1,-1)).rgb + texture(uState, vUv + px * vec2(-1,-1)).rgb);
  vec2 q = vUv - .5; c *= 1. - .55 * dot(q, q);
  c *= uExpose; c = 1. - exp(-c * 1.2);
  c = mix(vec3(dot(c, vec3(.3, .59, .11))), c, 1.42);
  c = pow(c, vec3(1.08, 1.04, 1.0));
  fragColor = vec4(c + dither(gl_FragCoord.xy, float(uFrame)), 1.);
}`;

let sh;
Stage.create({
  no: 4, title: 'Cloud Chamber', subtitle: 'volumetric raymarch · 80 bpm',
  duration: 24, background: '#d9c4ae', grain: 0.06, poster: 16.4,
  fade: { in: 1.2, out: 1.6, inColor: '#f1e1cd', outColor: '#f6ead8' },
  slate: { at: 0.9, hold: 3.2, color: 'rgba(54,40,52,.85)' },

  music(S) {
    const M = S.score({ bpm: 80, duration: 24, seed: 4 });
    M.master({ reverb: { decay: 4.4, size: 1.3, damp: 0.42 }, fadeIn: 0.8, fadeOut: 2.4 });
    const pad = M.track('pad', { inst: 'warmpad', reverb: 0.55, gain: (t) => 0.55 + 0.4 * Math.min(1, t / 15) });
    const str = M.track('strings', { reverb: 0.6, gain: 0.85, params: { cutoff: 3400, A: 0.6, R: 1.4 }, lowpass: (t) => 1100 + 4200 * Math.min(1, Math.max(0, (t - 6) / 9)) });
    const flute = M.track('flute', { reverb: 0.6, gain: 0.75, delay: { time: 1.5, fb: 0.28, mix: 0.2 } });
    const sub = M.track('sub', { reverb: 0.05, gain: 0.62 });
    const harp = M.track('harp', { reverb: 0.55, gain: 0.7 });
    const air = M.track('wind', { reverb: 0.3, gain: 0.55 }), wh = M.track('whoosh', { reverb: 0.5, gain: 0.5, params: { f1: 3000 } });
    const boom = M.track('impact', { reverb: 0.7, gain: 0.42 }), glint = M.track('glint', { inst: 'glass', reverb: 0.8, gain: 0.8, delay: { time: 0.75, fb: 0.4, mix: 0.3 } });
    air.hit(0, 0.8, M.beats);
    // rising harmony: F — Dm — Bb — C — Am(sus) | Bbmaj9 (the flare) — C6 — Fmaj9
    const prog = [['Fadd9', 'F1'], ['Dm7', 'D1'], ['Bbmaj7', 'Bb0'], ['C', 'C1'], ['Am7', 'A0'], ['Bbmaj9', 'Bb0'], ['C6', 'C1'], ['Fmaj9', 'F1']];
    prog.forEach(([c, root], i) => {
      const b = i * 4;
      pad.chord(b, c, 4, i < 5 ? 0.55 : 0.75);
      if (i >= 1) str.chord(b, c, 4, i < 5 ? 0.42 : 0.62, { octave: 4 });
      if (i >= 2) sub.note(b, root, 3.7, i < 5 ? 0.5 : 0.85);
      if (i >= 5) harp.arp(b, c, 0.5, 4, { octave: 4, octaves: 2, mode: 'up', vel: 0.42 });
    });
    flute.seq(4, 1, ['A4', '-', 'C5', 'D5', 'F5', '-', '-', 'E5', 'D5', '-', 'C5', '-', 'E5', '-', 'G5', '-'], { vel: 0.5 });
    flute.seq(20, 1, ['A5', '-', '-', 'G5', 'F5', '-', 'D5', '-', 'E5', '-', '-', 'C5', 'F5', '-', '-', '-'], { vel: 0.62 });
    wh.hit(M.b(12.4), 0.7, 3.4); boom.hit(20, 0.7, 4);
    const r = S.rng(8), pent = S.scale('F5', 'pentatonic', 2);
    for (let b = 20.5; b < 31; b += 0.5) if (r() < 0.5) glint.note(b, pent[(r() * pent.length) | 0], 0.5, 0.16 + 0.2 * r());
    return M;
  },

  setup() { sh = Stage.shader({ frag: MARCH, display: DISPLAY, feedback: true, scale: 0.6, z: 1 }); },

  frame(t) {
    // flight: steady forward drift, threading the corridor; the climb begins after the flare
    const z = 4 + 3.0 * t + 6 * prog(t, 12, 6, E.inOutSine);
    const px = (zz) => 1.6 * Math.sin(zz * 0.085) + 0.7 * Math.sin(zz * 0.21 + 1.3);
    const climb = prog(t, 15.5, 8.5, E.inOutSine);
    const ro = [px(z) * 0.82, 0.55 + 0.25 * Math.sin(t * 0.4) + 3.6 * climb, z];
    const ahead = z + 9, yaw = 0.16 * prog(t, 8, 9, E.inOutSine);
    const fw = [px(ahead) * 0.82 - ro[0] + yaw * 9, 0.4 - 1.3 * climb + 0.9 * prog(t, 19, 5, E.inOutSine), 9];
    const sun = [0.34, 0.20, 0.92], sl = Math.hypot(...sun);
    const flare = smoothstep(FLARE - 1.0, FLARE + 0.4, t) * (1 - 0.45 * smoothstep(FLARE + 1.5, 23, t)) + 0.35 * Stage.hit('impact', t, 1.4);
    sh.draw(t, {
      uRo: ro, uFw: fw, uSun: sun.map((v) => v / sl), uFlare: flare, uOpen: 1,
      uExpose: 1 + 0.16 * Stage.hit('impact', t, 1.2) + 0.06 * Math.sin(t * 0.5)
    });
  }
});
</script>
</body>
</html>
