<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nº 014 — Stained Glass</title>
<link rel="stylesheet" href="../lib/fonts/fonts.css">
<script src="../lib/stage.js"></script>
<script src="../lib/synth.js"></script>
<script src="../lib/vendor/d3.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
/* Nº 014 — STAINED GLASS
 * A Voronoi mosaic of random shards settles, ring by ring, into a rose window; then light passes through it.
 * Each site travels from a random start to its place in the rose; the Voronoi diagram is rebuilt every frame
 * (d3-delaunay). Eight bars at 96 bpm (2.5 s each): the window completes on the downbeat of bar 6 (12.5 s). */
const { ease: E, prog, win, clamp01, lerp, smoothstep, hash } = Stage;
const W = 1920, H = 1080, TAU = Math.PI * 2, CX = 960, CY = 540, R = 486, DONE = 12.5;
const GLASS = { cobalt: [28, 62, 168], ruby: [176, 26, 44], emerald: [18, 128, 92], amber: [232, 162, 38], violet: [98, 52, 150], ice: [132, 160, 204] };
let ctx, win2, sites = [];

function build() {
  const r = Stage.rng(1404);
  const add = (tx, ty, col, ring, stone) => sites.push({ tx, ty, sx: 80 + r() * (W - 160), sy: 60 + r() * (H - 120), col, ring, stone, ph: r() * TAU, k: r() });
  add(CX, CY, 'amber', 0);
  const rings = [[8, 78, ['ruby', 'cobalt'], 0], [8, 150, ['amber', 'amber'], 0.5], [16, 222, ['cobalt', 'emerald'], 0], [16, 300, ['ruby', 'violet'], 0.5], [32, 374, ['cobalt', 'amber', 'cobalt', 'ice'], 0], [32, 444, ['emerald', 'ruby', 'violet', 'ruby'], 0.5]];
  rings.forEach(([n, rad, cols, off], ri) => { for (let i = 0; i < n; i++) { const a = (i + off) / n * TAU - Math.PI / 2; add(CX + rad * Math.cos(a), CY + rad * Math.sin(a), cols[i % cols.length], ri + 1); } });
  // a rim of pale glass, then stone outside the window
  for (let i = 0; i < 48; i++) { const a = i / 48 * TAU; add(CX + (R + 18) * Math.cos(a), CY + (R + 18) * Math.sin(a), 'ice', 7, false); }
  for (let i = 0; i < 64; i++) { const a = (i + 0.5) / 64 * TAU; add(CX + (R + 64) * Math.cos(a), CY + (R + 64) * Math.sin(a), null, 8, true); }
  for (let i = 0; i < 150; i++) { let x, y; do { x = r() * W; y = r() * H; } while (Math.hypot(x - CX, y - CY) < R + 110); add(x, y, null, 9, true); }
}

Stage.create({
  no: 14, title: 'Stained Glass', subtitle: 'voronoi · d3-delaunay · 96 bpm',
  duration: 20, background: '#08070b', grain: 0.06, poster: 16.8, vignette: 0.3,
  slate: { at: 0.8, hold: 3.0 },

  music(S) {
    const M = S.score({ bpm: 96, duration: 20, seed: 14 });
    M.master({ reverb: { decay: 4.2, size: 1.3, damp: 0.35 }, fadeOut: 2.0 });
    const cel = M.track('celesta', { reverb: 0.55, gain: 0.9, delay: { time: 0.75, fb: 0.3, mix: 0.22 } }), gl = M.track('glass', { reverb: 0.6, gain: 0.6, pan: 0.2 });
    const org = M.track('organ', { reverb: 0.7, gain: (t) => 0.22 + 0.3 * Math.min(1, t / 12.5), lowpass: 2400 }), sub = M.track('sub', { reverb: 0.1, gain: 0.6 });
    const bell = M.track('bell', { reverb: 0.8, gain: 0.85 }), str = M.track('strings', { reverb: 0.7, gain: 0.6, params: { cutoff: 3600 } });
    const prog = ['Aadd9', 'F#m7', 'Dmaj7', 'E6', 'Aadd9', 'F#m9', 'Dmaj9', 'Aadd9'], roots = ['A1', 'F#1', 'D1', 'E1', 'A1', 'F#1', 'D1', 'A1'];
    prog.forEach((c, i) => {
      const b = i * 4;
      org.chord(b, c, 4, 0.5, { octave: 3 });
      if (i >= 1) sub.note(b, roots[i], 3.6, i >= 5 ? 0.85 : 0.55);
      if (i < 7) cel.arp(b, c, i < 2 ? 1 : 0.5, 4, { octave: 4, octaves: 2, mode: i % 2 ? 'down' : 'up', vel: 0.5 });
      if (i >= 2 && i < 7) gl.arp(b + 0.25, c, 0.5, 4, { octave: 5, mode: 'updown', vel: 0.3 });
      if (i >= 5) str.chord(b, c, 4, 0.5, { octave: 4 });
    });
    bell.note(20, 'A4', 6, 0.9); bell.note(20, 'E5', 6, 0.6); bell.note(28, 'A5', 4, 0.5);
    cel.chord(28, ['A4', 'C#5', 'E5', 'B5'], 4, 0.6, { strum: 0.12 });
    return M;
  },

  setup() { ctx = Stage.canvas2d({ z: 1 }); win2 = Stage.buffer(W, H); build(); },

  frame(t) {
    const c = win2, pts = new Float64Array(sites.length * 2), settle = new Float32Array(sites.length);
    sites.forEach((s, i) => {
      // sites settle from the centre outwards; before that they drift like loose shards
      const t0 = 2.2 + s.ring * 0.72, e = prog(t, t0, 3.4, E.inOutCubic); settle[i] = e;
      const wob = (1 - e) * 26, dx = wob * Math.sin(t * 0.5 + s.ph), dy = wob * Math.cos(t * 0.43 + s.ph * 1.7);
      const spin = (1 - e) * 0.5 * (1 - s.ring / 10), ax = s.sx - CX, ay = s.sy - CY, cs = Math.cos(spin), sn = Math.sin(spin);
      pts[i * 2] = lerp(CX + ax * cs - ay * sn, s.tx, e) + dx; pts[i * 2 + 1] = lerp(CY + ax * sn + ay * cs, s.ty, e) + dy;
    });
    const vor = new d3.Delaunay(pts).voronoi([-40, -40, W + 40, H + 40]);
    const done = smoothstep(DONE - 2.5, DONE, t);
    // the light: a dim even glow at first, then a source that sweeps across (bars 7–8)
    const sweep = prog(t, DONE + 0.6, 6.6, E.inOutSine), lx = lerp(-300, W + 300, sweep), ly = 380 + 120 * Math.sin(sweep * Math.PI);
    const lightOn = win(t, DONE + 0.2, 19.6, 1.4, 1.2), flash = Stage.hit('bell', t, 1.6);
    c.fillStyle = '#060508'; c.fillRect(0, 0, W, H);
    sites.forEach((s, i) => {
      const x = pts[i * 2], y = pts[i * 2 + 1];
      c.beginPath(); vor.renderCell(i, c);
      if (s.stone) {
        const v = 12 + 9 * s.k + 10 * lightOn * Math.exp(-Math.pow(Math.hypot(x - lx, y - ly) / 520, 2));
        c.fillStyle = `rgb(${v + 3},${v},${v + 6})`; c.fill();
      } else {
        const col = GLASS[s.col], d = Math.hypot(x - lx, y - ly);
        const lum = 0.42 + 0.16 * Math.sin(t * 0.7 + s.ph) * (1 - done) + 0.13 * done + 0.50 * lightOn * Math.exp(-Math.pow(d / 430, 2)) + 0.26 * flash * Math.exp(-Math.pow(Math.hypot(x - CX, y - CY) / 380, 2)) + 0.12 * settle[i];
        const g = c.createRadialGradient(x - 8, y - 10, 2, x, y, 74);
        const k1 = lum * 1.38, k0 = lum * 0.70, f = (v, k) => Math.min(255, Math.round(v * k + 255 * Math.max(0, k - 1.25) * 0.55));
        g.addColorStop(0, `rgb(${f(col[0], k1)},${f(col[1], k1)},${f(col[2], k1)})`); g.addColorStop(1, `rgb(${f(col[0], k0)},${f(col[1], k0)},${f(col[2], k0)})`);
        c.fillStyle = g; c.fill();
      }
    });
    // leading: dark came with a faint highlight
    c.lineJoin = 'round'; c.strokeStyle = '#050406'; c.lineWidth = 6.5; c.beginPath(); vor.render(c); c.stroke();
    c.strokeStyle = 'rgba(120,116,130,.20)'; c.lineWidth = 1.2; c.beginPath(); vor.render(c); c.stroke();
    // compose: coloured light spilling off the glass onto the stone, then the window itself
    const m = ctx; m.globalCompositeOperation = 'source-over'; m.filter = 'none'; m.globalAlpha = 1; m.drawImage(c.canvas, 0, 0);
    const spill = 0.16 + 0.22 * lightOn + 0.14 * flash;
    m.globalCompositeOperation = 'lighter'; m.filter = 'blur(44px)'; m.globalAlpha = Math.min(1, spill); m.drawImage(c.canvas, 0, 0);
    m.filter = 'none'; m.globalAlpha = 1; m.globalCompositeOperation = 'source-over';
    // the stone tracery ring that frames the rose once it has formed
    if (done > 0) { m.strokeStyle = `rgba(8,7,10,${done})`; m.lineWidth = 16; m.beginPath(); m.arc(CX, CY, R + 44, 0, TAU); m.stroke(); m.strokeStyle = `rgba(150,140,160,${0.16 * done})`; m.lineWidth = 1.5; m.beginPath(); m.arc(CX, CY, R + 53, 0, TAU); m.stroke(); }
  }
});
</script>
</body>
</html>
