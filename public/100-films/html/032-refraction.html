<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nº 032 — Refraction</title>
<link rel="stylesheet" href="../lib/fonts/fonts.css">
<script src="../lib/stage.js"></script>
<script src="../lib/synth.js"></script>
<script src="../lib/vendor/three.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
/* Nº 032 — REFRACTION
 * Cut-glass solids turning in studio light (three.js physical transmission with dispersion and thin-film
 * iridescence, a soft-box room for reflections). Seven bars at 84 bpm (2.86 s each): one prism finds the light →
 * others drift in and their refractions overlap → on bar 5 they align and a band of soft spectrum crosses the
 * backdrop → slow separation. */
const { ease: E, prog, win, clamp01, lerp, smoothstep, hash } = Stage;
const BAR = 240 / 84, PEAK = BAR * 4;
let T3, objs = [], band, bars = [], shadows = [];

Stage.create({
  no: 32, title: 'Refraction', subtitle: 'three.js · transmission · 84 bpm',
  duration: 20, background: '#f1dcd8', grain: 0.045, poster: 12.6,
  fade: { in: 1.2, out: 1.6, color: '#f6e9e4' },
  slate: { at: 0.9, hold: 3.0, color: 'rgba(60,50,70,.8)' },

  music(S) {
    const M = S.score({ bpm: 84, duration: 20, seed: 32 });
    M.master({ reverb: { decay: 4.6, size: 1.3, damp: 0.3 }, fadeIn: 0.5, fadeOut: 2.6 });
    const gl = M.track('glass', { reverb: 0.65, gain: 0.9, delay: { time: 0.75, fb: 0.4, mix: 0.3 } }), bell = M.track('bell', { reverb: 0.75, gain: 0.5 });
    const pad = M.track('glasspad', { reverb: 0.7, gain: (t) => 0.3 + 0.3 * smoothstep(4, PEAK, t), params: { A: 1.8, R: 3 } }), sub = M.track('sub', { reverb: 0.1, gain: 0.5, params: { A: 0.6, R: 1.5 } });
    const ch = M.track('chime', { reverb: 0.8, gain: 0.5, delay: { time: 0.5, fb: 0.4, mix: 0.3 } }), wh = M.track('whoosh', { reverb: 0.6, gain: 0.3, params: { f0: 900, f1: 9000 } });
    const prog = ['Bmaj9', 'G#m9', 'Emaj9', 'F#6', 'Bmaj9', 'Emaj9', 'Badd9'], roots = ['B1', 'G#1', 'E1', 'F#1', 'B1', 'E1', 'B1'];
    prog.forEach((c, i) => {
      const b = i * 4, n = S.chord(c, 4);
      pad.chord(b, c, 4, 0.5, { octave: 3 }); if (i >= 1) sub.note(b, roots[i], 3.6, i >= 4 ? 0.8 : 0.5);
      if (i < 6) gl.seq(b, i < 2 ? 1 : 0.5, i < 2 ? [n[2] + 12, n[1] + 12, n[3] + 12, n[2] + 12] : [n[0] + 12, n[2] + 12, n[3] + 12, n[1] + 24, n[2] + 12, n[3] + 12, n[1] + 24, n[2] + 24], { vel: 0.45 + 0.04 * i, gate: 1.8 });
    });
    bell.note(16, 'F#5', 6, 0.8); bell.note(16, 'B5', 6, 0.6); bell.note(16.5, 'D#6', 6, 0.5); wh.hit(14.6, 0.8, 3);
    const r = S.rng(6), sc = S.scale('B5', 'pentatonic', 2); for (let b = 16.5; b < 27; b += 0.5) if (r() < 0.55) ch.note(b, sc[(r() * sc.length) | 0], 1, 0.2 + 0.2 * r());
    gl.chord(24, ['B4', 'F#5', 'C#6', 'D#6'], 4, 0.5, { strum: 0.15 });
    return M;
  },

  setup() {
    const T = THREE;
    T3 = Stage.three({ fov: 26, bloom: { strength: 0.12, radius: 0.7, threshold: 0.98 }, exposure: 0.8, z: 1 });
    const { scene, renderer, camera } = T3;
    // seamless backdrop: a gradient from blush to pale blue
    const bg = Stage.buffer(64, 512), g = bg.createLinearGradient(0, 0, 0, 512); g.addColorStop(0, '#8fb0e4'); g.addColorStop(0.5, '#e4bfd2'); g.addColorStop(1, '#efb49c'); bg.fillStyle = g; bg.fillRect(0, 0, 64, 512);
    const bt = new T.CanvasTexture(bg.canvas); bt.colorSpace = T.SRGBColorSpace; scene.background = bt;
    const pm = new T.PMREMGenerator(renderer); scene.environment = pm.fromScene(new T.RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.42;
    // floor, catching soft contact shadows and a little sheen
    const floor = new T.Mesh(new T.PlaneGeometry(60, 60), new T.MeshStandardMaterial({ color: '#e2ada0', roughness: 0.85, metalness: 0 })); floor.rotation.x = -Math.PI / 2; floor.position.y = -1.9;   // (kept out of the scene: the backdrop is seamless, only the contact shadows remain)
    const sc = Stage.buffer(256, 256), sg = sc.createRadialGradient(128, 128, 0, 128, 128, 128); sg.addColorStop(0, 'rgba(90,60,80,.42)'); sg.addColorStop(0.6, 'rgba(90,60,80,.12)'); sg.addColorStop(1, 'rgba(90,60,80,0)'); sc.fillStyle = sg; sc.fillRect(0, 0, 256, 256);
    const st = new T.CanvasTexture(sc.canvas);
    // thin luminous bars far behind: something for the glass to bend
    [['#ff8f7a', -5.2], ['#8fe0c8', -1.2], ['#b9a6ff', 2.6], ['#ffd27a', 6.0]].forEach(([c, x], i) => { const m = new T.Mesh(new T.BoxGeometry(0.09, 9, 0.09), new T.MeshBasicMaterial({ color: c })); m.position.set(x, 1.6, -9 - i * 0.4); scene.add(m); bars.push(m); });
    const glass = (tint) => new T.MeshPhysicalMaterial({ color: '#ffffff', transmission: 1, thickness: 1.1, roughness: 0.02, metalness: 0, ior: 1.52, dispersion: 7, attenuationColor: tint, attenuationDistance: 3.2, iridescence: 0.18, iridescenceIOR: 1.3, iridescenceThicknessRange: [120, 420], clearcoat: 0, envMapIntensity: 0.45, specularIntensity: 0.7 });
    const defs = [
      { geo: new T.CylinderGeometry(1.05, 1.05, 2.9, 3, 1), tint: '#ffc2b3', home: [-0.2, 0.1, 0], from: [-0.2, 0.1, 0], spin: [0.3, 0.42, 0.1], t0: 0 },
      { geo: new T.IcosahedronGeometry(1.12, 0), tint: '#b5d2ff', home: [2.75, -0.25, -0.6], from: [9, 1.2, -3], spin: [0.25, -0.3, 0.2], t0: BAR * 1.2 },
      { geo: new T.RoundedBoxGeometry(1.5, 2.3, 0.55, 6, 0.16), tint: '#b4efd3', home: [-3.0, -0.1, -0.9], from: [-9.5, 0.6, -3.5], spin: [-0.1, 0.36, 0.05], t0: BAR * 2.0 },
      { geo: new T.OctahedronGeometry(0.78, 0), tint: '#ffdc9a', home: [1.15, 1.75, -1.6], from: [4, 7, -4], spin: [0.4, 0.3, -0.25], t0: BAR * 2.7 }
    ];
    defs.forEach((d, i) => { const m = new T.Mesh(d.geo, glass(d.tint)); scene.add(m); const s = new T.Mesh(new T.PlaneGeometry(1, 1), new T.MeshBasicMaterial({ map: st, transparent: true, depthWrite: false })); s.rotation.x = -Math.PI / 2; s.position.y = -1.89; scene.add(s); objs.push(Object.assign({ m, s, i }, d)); });
    scene.add(new T.HemisphereLight('#ffffff', '#e8b8a8', 0.5));
    const key = new T.DirectionalLight('#fff4ea', 1.3); key.position.set(-4, 7, 6); scene.add(key);
    // the spectrum band that crosses the backdrop at the peak: a soft additive plane
    const sb = Stage.buffer(512, 64), sp = sb.createLinearGradient(0, 0, 512, 0); [['rgba(255,120,110,0)', 0], ['rgba(255,150,120,.9)', 0.16], ['rgba(255,220,130,.9)', 0.34], ['rgba(150,235,180,.9)', 0.52], ['rgba(130,190,255,.9)', 0.7], ['rgba(190,150,255,.9)', 0.86], ['rgba(190,150,255,0)', 1]].forEach(([c, p]) => sp.addColorStop(p, c)); sb.fillStyle = sp; sb.fillRect(0, 0, 512, 64);
    const vm = sb.getImageData(0, 0, 512, 64); for (let y = 0; y < 64; y++) { const a = Math.sin(y / 63 * Math.PI); for (let x = 0; x < 512; x++) vm.data[(y * 512 + x) * 4 + 3] *= a * a; } sb.putImageData(vm, 0, 0);
    band = new T.Mesh(new T.PlaneGeometry(13, 1.5), new T.MeshBasicMaterial({ map: new T.CanvasTexture(sb.canvas), transparent: true, opacity: 0, blending: T.AdditiveBlending, depthWrite: false })); band.position.set(0, 1.2, -8.6); band.rotation.z = 0.5; scene.add(band);
    camera.position.set(0, 0.5, 15);
  },

  frame(t) {
    const { camera } = T3;
    const align = win(t, PEAK - 1.6, PEAK + 2.4, 1.6, 2.2, E.inOutSine), apart = prog(t, PEAK + 2.6, 5, E.inOutSine);
    for (const o of objs) {
      const a = prog(t, o.t0, BAR * 1.6, E.outCubic), fl = t * 0.5 + o.i * 1.7;
      const x = lerp(o.from[0], o.home[0], a) * (1 - 0.34 * align) * (1 + 0.5 * apart), y = lerp(o.from[1], o.home[1], a) + 0.16 * Math.sin(fl) - 0.2 * align * o.home[1], z = lerp(o.from[2], o.home[2], a) + 0.5 * apart * (o.i % 2 ? -1 : 1);
      o.m.position.set(x, y, z);
      // free tumbling, easing into a shared orientation at the moment of alignment
      const rx = o.spin[0] * t + o.i, ry = o.spin[1] * t + o.i * 2, rz = o.spin[2] * t;
      o.m.rotation.set(lerp(rx, Math.round(rx / (Math.PI / 2)) * (Math.PI / 2) + 0.35, align * 0.85), ry, lerp(rz, 0, align * 0.85));
      o.m.scale.setScalar(a > 0 ? 0.6 + 0.4 * a : 0.001);
      o.s.position.x = x + 0.25; o.s.position.z = z + 0.2; const sh = 2.6 + 1.4 * (y + 1.9) / 2; o.s.scale.set(sh, sh, 1); o.s.material.opacity = 0.9 * a / (1 + 0.35 * (y + 1.9));
    }
    band.material.opacity = 0.62 * align * (0.85 + 0.15 * Math.sin(t * 3)); band.position.x = lerp(-3.5, 2.5, prog(t, PEAK - 1.6, 5.4, E.inOutSine)); band.rotation.z = 0.5 - 0.12 * prog(t, PEAK - 1.6, 5.4);
    bars.forEach((b, i) => { b.position.x += 0; b.scale.y = 0.6 + 0.4 * prog(t, 0.6 + i * 0.5, 2.5, E.outCubic); b.position.x = [-5.2, -1.2, 2.6, 6.0][i] + 0.5 * Math.sin(t * 0.22 + i * 2); });
    const orb = 0.16 * Math.sin(t * 0.21 - 0.4); camera.position.set(Math.sin(orb) * 15, 0.7 + 0.5 * Math.sin(t * 0.13), Math.cos(orb) * 15 - 1.2 * prog(t, 0, 20, E.inOutSine)); camera.lookAt(0, 0.1, 0);
    T3.bloom.strength = 0.12 + 0.14 * align + 0.06 * Stage.hit('chime', t, 0.5);
    T3.render();
  }
});
</script>
</body>
</html>
