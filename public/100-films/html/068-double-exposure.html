<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nº 068 — Double Exposure</title>
<link rel="stylesheet" href="../lib/fonts/fonts.css">
<script src="../lib/stage.js"></script>
<script src="../lib/synth.js"></script>
<script src="../assets/img/068-profile.js"></script>
<script src="../assets/img/068-forest.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
/* Nº 068 — DOUBLE EXPOSURE
 * Two generated photographs share one frame: a head in profile, and a conifer forest in mist. The silhouette
 * becomes an alpha mask; the forest exists only inside it, rising from the shoulders and dissolving to white
 * at the crown. Inside, the trees sway (the image is drawn in strips that lean with height) and two layers of
 * fog drift; at the peak a few birds lift from the treetops and fly out through the outline into the white.
 * Then the fog thins everything away. Six bars at 72 bpm (3.33 s each). */
const { ease: E, prog, win, clamp01, lerp, smoothstep, hash } = Stage;
const W = 1920, H = 1080, TAU = Math.PI * 2, MX = 391, MY = 44, MW = 1138, MH = 1040, PAPER = '#f3f0e9';
let ctx, B, mask, forest, fog, bg;
const BIRDS = Array.from({ length: 11 }, (_, i) => ({ t0: 9.7 + 3.4 * hash(i, 1) * hash(i, 7) + (i === 0 ? 0 : 0.2 * i), x: 800 + 330 * hash(i, 2), y: 330 + 150 * hash(i, 3), a: -0.5 - 0.5 * hash(i, 4), sp: 150 + 120 * hash(i, 5), s: 12 + 13 * hash(i, 6), f: 4.6 + 2.6 * hash(i, 8), c: (hash(i, 9) - 0.5) * 0.22 }));

Stage.create({
  no: 68, title: 'Double Exposure', subtitle: 'a forest in mind · 72 bpm',
  duration: 20, background: PAPER, grain: 0.06, poster: 11.8,
  fade: { in: 0.8, out: 1.6, color: PAPER },
  slate: { at: 0.7, hold: 2.8, pos: 'bl', color: 'rgba(40,48,44,.82)' },

  music(S) {
    const M = S.score({ bpm: 72, duration: 20, seed: 68 });
    M.master({ reverb: { decay: 3.8, size: 1.2, damp: 0.4 }, fadeIn: 0.3, fadeOut: 2.4 });
    const felt = M.track('felt', { reverb: 0.5, gain: 0.85, humanize: 0.014 }), str = M.track('strings', { reverb: 0.6, gain: (t) => 0.1 + 0.26 * smoothstep(3, 11, t) * (1 - smoothstep(14, 19.5, t)) }), air = M.track('air', { reverb: 0.5, gain: 0.16 }), sub = M.track('sub', { reverb: 0.05, gain: 0.24 }), fl = M.track('flute', { reverb: 0.6, gain: 0.3, pan: 0.3 });
    const bars = [['E2', ['E3', 'B3', 'G4']], ['C2', ['C3', 'G3', 'E4', 'B4']], ['G2', ['G3', 'D4', 'B4']], ['D2', ['D3', 'A3', 'F#4', 'G4']], ['A1', ['A2', 'E3', 'C4', 'G4']], ['E2', ['E3', 'B3', 'G4', 'B4']]];
    const mel = [[[1, 'B4', 1.5], [2.5, 'E5', 1.5]], [[0, 'G5', 1.5], [1.5, 'E5', 0.5], [2, 'B4', 2]], [[0, 'D5', 1], [1, 'G5', 1], [2, 'B5', 2]], [[0, 'A5', 1], [1, 'F#5', 1], [2, 'D5', 1], [3, 'E5', 1]], [[0, 'E5', 1.5], [1.5, 'C5', 0.5], [2, 'A4', 2]], [[0, 'B4', 2], [2, 'E5', 2]]];
    bars.forEach(([r, ch], i) => {
      const b = i * 4; felt.note(b, r, 3.5, 0.5); ch.forEach((n, k) => felt.note(b + 0.5 + k * 0.5, n, 2.5, 0.34)); mel[i].forEach(([o, n, d]) => felt.note(b + o, n, d + 0.5, 0.5));
      str.chord(b, ch.map((n) => S.midi(n) + 12), 4.2, 0.5); if (i >= 1 && i < 5) sub.note(b, r, 3.6, 0.5);
    });
    // the birds: a few quick rising notes
    BIRDS.slice(0, 7).forEach((bd, i) => fl.note(M.b(bd.t0), ['B5', 'E6', 'D6', 'G6', 'F#6', 'A6', 'B6'][i], 0.5, 0.3));
    air.hit(0, 0.5, 20);
    return M;
  },

  async setup() {
    bg = Stage.canvas2d({ z: 1 }); ctx = Stage.canvas2d({ z: 2 }); B = Stage.buffer(W, H);
    const g = bg.createRadialGradient(960, 480, 200, 960, 540, 1250); g.addColorStop(0, '#f7f4ee'); g.addColorStop(1, '#e9e5db'); bg.fillStyle = g; bg.fillRect(0, 0, W, H);
    // silhouette → alpha
    const pi = await Stage.image('068-profile'), m = Stage.buffer(pi.naturalWidth, pi.naturalHeight); m.drawImage(pi, 0, 0); const id = m.getImageData(0, 0, pi.naturalWidth, pi.naturalHeight), d = id.data;
    for (let i = 0; i < d.length; i += 4) { const l = (d[i] + d[i + 1] + d[i + 2]) / 765; d[i + 3] = Math.round(255 * smoothstep(0.75, 0.25, l)); d[i] = d[i + 1] = d[i + 2] = 0; } m.putImageData(id, 0, 0); mask = m.canvas;
    // forest, a little muted
    const fi = await Stage.image('068-forest'); forest = Stage.buffer(1240, 1860); forest.filter = 'saturate(0.72) contrast(1.06)'; forest.drawImage(fi, 0, 0, 1240, 1860); forest.filter = 'none';
    // fog texture
    fog = Stage.buffer(512, 256); const fd = fog.createImageData(512, 256), nz = Stage.makeNoise(68);
    for (let y = 0; y < 256; y++) for (let x = 0; x < 512; x++) { const v = smoothstep(0.38, 0.8, 0.5 + 0.5 * nz.fbm2(x / 120, y / 70, 4)), i = (y * 512 + x) * 4; fd.data[i] = 246; fd.data[i + 1] = 247; fd.data[i + 2] = 244; fd.data[i + 3] = Math.round(255 * v * smoothstep(0, 30, y) * smoothstep(256, 226, y)); }
    fog.putImageData(fd, 0, 0);
  },

  frame(t) {
    const b = B; b.globalCompositeOperation = 'source-over'; b.globalAlpha = 1; b.clearRect(0, 0, W, H);
    // the forest, in leaning strips
    const N = 124, sh = 1860 / N, FX = 340, FY = -560;
    for (let k = 0; k < N; k++) { const y = FY + k * sh; if (y > H || y + sh < 0) continue; const v = 1 - (k + 0.5) / N, dx = 7 * Math.pow(v, 1.4) * Math.sin(t * 0.8 + v * 5) + 2.5 * v * Math.sin(t * 1.9 + v * 11); b.drawImage(forest.canvas, 0, k * sh, 1240, sh + 0.6, FX + dx, y, 1240, sh + 0.5); }
    // drifting fog
    b.globalAlpha = 0.36; b.drawImage(fog.canvas, -900 + 34 * t, 200, 3400, 760); b.globalAlpha = 0.3; b.drawImage(fog.canvas, 300 - 52 * t, 480, 4200, 700); b.globalAlpha = 0.34; b.drawImage(fog.canvas, -1500 + 22 * t, -60, 3800, 640); b.globalAlpha = 1;
    // dissolve to white at the crown; at the end the fog takes everything, top down
    const thin = prog(t, 14.2, 5.2, E.inOutSine), y0 = lerp(30, 1000, thin), y1 = lerp(600, 1700, thin), wg = b.createLinearGradient(0, y0, 0, y1); wg.addColorStop(0, 'rgba(243,240,233,1)'); wg.addColorStop(0.45, 'rgba(243,240,233,.62)'); wg.addColorStop(1, 'rgba(243,240,233,0)'); b.fillStyle = wg; b.fillRect(0, 0, W, H);
    if (y0 > 0) { b.fillStyle = PAPER; b.fillRect(0, 0, W, y0 + 1); }
    // reveal from the shoulders up, then cut to the silhouette
    const rev = prog(t, 1.4, 8.2, E.inOutSine), ye = lerp(1140, -340, rev), rg = b.createLinearGradient(0, ye, 0, ye + 330); rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,1)');
    b.globalCompositeOperation = 'destination-in'; b.fillStyle = rg; b.fillRect(0, 0, W, H); b.drawImage(mask, MX, MY, MW, MH); b.globalCompositeOperation = 'source-over';

    const c = ctx, push = 1 + 0.05 * E.inOutSine(clamp01(t / 20)); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, W, H); c.translate(W / 2, H * 0.62); c.scale(push, push); c.translate(-W / 2, -H * 0.62);
    // a breath of the silhouette before and after the forest
    c.globalAlpha = 0.055 * prog(t, 0.5, 1.2) + 0.03 * thin; c.drawImage(mask, MX, MY, MW, MH); c.globalAlpha = 1;
    c.drawImage(b.canvas, 0, 0);
    // birds: up from the treetops and out through the outline
    c.strokeStyle = '#26332d'; c.lineCap = 'round'; c.lineJoin = 'round';
    for (const bd of BIRDS) {
      const u = t - bd.t0; if (u < 0 || u > 9) continue;
      const acc = E.outCubic(clamp01(u / 1.2)), dist = bd.sp * (u * 0.35 + 0.65 * u * acc), ang = bd.a + bd.c * u, x = bd.x + Math.cos(bd.a) * dist + 30 * Math.sin(u * 0.9 + bd.s), y = bd.y + Math.sin(bd.a) * dist - 10 * u * u * 0.3, fl = Math.sin(u * bd.f * TAU), w = bd.s * (1 + 0.04 * u);
      c.globalAlpha = clamp01(u / 0.4) * (1 - clamp01((u - 6.5) / 2)) * 0.9; c.lineWidth = Math.max(1.6, w * 0.13);
      c.save(); c.translate(x, y); c.rotate(ang * 0.35 + 0.1);
      c.beginPath(); c.moveTo(-w, -fl * w * 0.55 - w * 0.1); c.quadraticCurveTo(-w * 0.45, -w * 0.32 - fl * w * 0.18, 0, 0); c.quadraticCurveTo(w * 0.45, -w * 0.32 - fl * w * 0.18, w, -fl * w * 0.55 - w * 0.1); c.stroke();
      c.fillStyle = '#26332d'; c.beginPath(); c.ellipse(0, 1, w * 0.2, w * 0.09, 0, 0, TAU); c.fill(); c.restore();
    }
    c.globalAlpha = 1;
  }
});
</script>
</body>
</html>
