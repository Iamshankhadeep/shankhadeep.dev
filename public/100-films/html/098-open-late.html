/* Nº 098 — OPEN LATE

 * discharge spreads inward from both ends, flutters by a few percent for half a second, and settles as the
 * gas warms. The wall is lit, not fogged: the tubes are drawn small into a light buffer, blurred, and
 * multiplied by the bricks' own colour before being added, so mortar stays dark and wet edges pick up the
 * colour. Arrow first, then OPEN letter by letter; LATE needs two soft tries before it catches; the white
