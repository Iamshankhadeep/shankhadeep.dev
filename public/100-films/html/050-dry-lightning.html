<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nº 050 — Dry Lightning</title>
<link rel="stylesheet" href="../lib/fonts/fonts.css">
<script src="../lib/stage.js"></script>
<script src="../lib/synth.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
/* Nº 050 — DRY LIGHTNING
 * A storm cell over an empty plain, lit from within. The cloud is a fragment shader (layered noise, lit by
 * up to three glows whose strength the film controls); bolts, the plain, the tree and the telegraph poles are
 * drawn over it. Flashes are soft and at least 1.5 s apart, with a smooth decay — no white frames.
 * Four bars at 60 bpm (4 s each): sheet lightning inside the cloud → a first bolt → a triple fork on bar 3 (10 s)
 * → afterglow. Thunder follows each flash after a pause, as it does. */
const { ease: E, prog, win, clamp01, lerp, smoothstep, hash } = Stage;
const W = 1920, H = 1080, TAU = Math.PI * 2, HOR = 850;
// flashes: time, x (px), y (px), strength, bolt?, thunder delay
const FL = [{ t: 1.8, x: 620, y: 300, s: 0.45, d: 2.6 }, { t: 4.4, x: 1280, y: 250, s: 0.55, d: 2.2 }, { t: 6.6, x: 900, y: 330, s: 0.8, bolt: 1, d: 1.7 }, { t: 10.0, x: 1080, y: 300, s: 1.0, bolt: 3, d: 1.1 }, { t: 12.4, x: 520, y: 280, s: 0.4, d: 2.4 }, { t: 14.1, x: 1420, y: 320, s: 0.3, d: 3 }];
// envelope of a flash: quick rise, a softer second pulse, long smooth tail
const env = (a) => a < 0 ? 0 : Math.min(1, a / 0.06) * (0.62 * Math.exp(-a / 0.16) + 0.38 * Math.exp(-a / 0.9)) + 0.3 * Math.exp(-Math.pow((a - 0.26) / 0.07, 2));
let sh, ctx, bolts = [];

function makeBolt(x0, y0, x1, y1, seed, depth) {       // midpoint displacement, with forks
  const r = Stage.rng(seed), pts = [[x0, y0], [x1, y1]];
  for (let it = 0; it < 7; it++) for (let i = pts.length - 1; i > 0; i--) { const a = pts[i - 1], b = pts[i], d = Math.hypot(b[0] - a[0], b[1] - a[1]) * 0.21; pts.splice(i, 0, [(a[0] + b[0]) / 2 + (r() - 0.5) * d * 2, (a[1] + b[1]) / 2 + (r() - 0.5) * d * 0.8]); }
  const forks = [];
  if (depth < 2) for (let k = 0; k < 4 - depth * 2; k++) { const i = Math.floor(pts.length * (0.15 + 0.6 * r())), p = pts[i], len = (120 + 260 * r()) / (depth + 1), a = Math.PI / 2 + (r() - 0.5) * 1.5; forks.push(makeBolt(p[0], p[1], p[0] + Math.cos(a) * len, p[1] + Math.sin(a) * len * 0.9, seed * 7 + k + 1, depth + 1)); }
  return { pts, forks, w: 3.2 / (depth + 1) };
}

const FRAG = `
uniform vec4 uF[3];        // xy = position (0..1, y up), z = intensity, w = radius
float fbm6(vec2 p){ float a = .5, s = 0.; for (int i = 0; i < 6; i++) { s += a * vnoise(p); p = rot(.5) * p * 2.03 + 11.; a *= .5; } return s; }
void main(){
  vec2 uv = gl_FragCoord.xy / uRes; float asp = uRes.x / uRes.y; vec2 p = vec2(uv.x * asp, uv.y);
  // sky behind: deep slate, a strip of last light at the horizon
  vec3 col = mix(vec3(.105, .105, .16), vec3(.030, .034, .070), smoothstep(.2, .95, uv.y));
  col += vec3(.36, .22, .20) * exp(-pow((uv.y - .215) / .05, 2.)) * .75;
  // the cell: an anvil of cloud, dense above, ragged at its base
  vec2 q = p * vec2(1.25, 2.1) + vec2(uTime * .012, 0.);
  float n = fbm6(q + .35 * vec2(fbm6(q * 1.7 + 3.), fbm6(q * 1.7 - 5.)));
  float shape = smoothstep(.33, .60, uv.y + .16 * (n - .5) - .10 * exp(-pow((uv.x - .52) / .34, 2.))) * (1. - .30 * smoothstep(.2, .0, abs(uv.x - .5) - .46));
  float dens = clamp(shape * (.45 + 1.1 * n), 0., 1.);
  vec3 cloud = mix(vec3(.055, .060, .105), vec3(.150, .155, .235), n) * (.55 + .5 * smoothstep(.35, .95, uv.y));
  // light from inside: each glow brightens the cloud around it, more where the cloud is thin
  vec3 lit = vec3(0.);
  for (int i = 0; i < 3; i++) { vec2 d = (uv - uF[i].xy) * vec2(asp, 1.); float g = exp(-dot(d, d) / (uF[i].w * uF[i].w)); lit += vec3(.66, .70, 1.) * g * uF[i].z * (.35 + 1.25 * n * n) + vec3(.9, .85, 1.) * exp(-dot(d, d) / (uF[i].w * uF[i].w * .08)) * uF[i].z * .35; }
  cloud += lit * (.9 - .35 * dens);
  col = mix(col, cloud, dens);
  col += lit * .10 * (1. - dens);                                    // a little spills onto the sky
  // rain shafts under the base, far off
  float shaft = smoothstep(.36, .30, uv.y) * smoothstep(.20, .26, uv.y) * (vnoise(vec2(uv.x * 34. + uv.y * 3., 1.)) * .6 + .4) * smoothstep(.25, .6, vnoise(vec2(uv.x * 3.1, 7.)));
  col = mix(col, vec3(.085, .09, .14), shaft * .5);
  vec2 v = uv - .5; col *= 1. - .7 * dot(v, v);
  fragColor = vec4(pow(col, vec3(.92)) + dither(gl_FragCoord.xy, float(uFrame)), 1.);
}`;

Stage.create({
  no: 50, title: 'Dry Lightning', subtitle: 'shader + canvas · 60 bpm',
  duration: 16, background: '#0b0c16', grain: 0.07, poster: 10.12,
  fade: { in: 1.4, out: 1.8 }, slate: { at: 0.8, hold: 2.8 },

  music(S) {
    const M = S.score({ bpm: 60, duration: 16, seed: 50 });
    M.master({ reverb: { decay: 5.5, size: 1.5, damp: 0.6 }, fadeIn: 0.6, fadeOut: 2.6 });
    const str = M.track('strings', { reverb: 0.6, gain: 0.7, params: { cutoff: 900, A: 2, R: 3 }, lowpass: (t) => 500 + 900 * smoothstep(5, 10, t) }), low = M.track('reese', { reverb: 0.3, gain: 0.3, params: { A: 2, R: 3, cutoff: 220 } });
    const th = M.track('thunder', { inst: 'impact', reverb: 0.85, gain: 0.8, params: { f0: 70, f1: 28, lp: 190, decay: 3.2 } }), crack = M.track('crack', { inst: 'impact', reverb: 0.7, gain: 0.34, params: { f0: 220, f1: 60, lp: 1400, decay: 0.9 } });
    const rain = M.track('rain', { inst: 'air', reverb: 0.2, gain: 1.0, params: { type: 'bp', freq: 2400, q: 0.5 } }), wind = M.track('wind', { reverb: 0.4, gain: 0.7 }), pno = M.track('piano', { reverb: 0.75, gain: 0.7, delay: { time: 1.5, fb: 0.3, mix: 0.2 } });
    rain.hit(0, 0.6, 16); wind.hit(0, 0.8, 16);
    str.chord(0, ['C2', 'G2', 'Eb3'], 8, 0.6); str.chord(8, ['Ab1', 'Eb2', 'C3', 'G3'], 4, 0.7); str.chord(12, ['C2', 'G2', 'D3', 'Eb3'], 4, 0.6); low.note(0, 'C1', 8, 0.7); low.note(8, 'Ab0', 4, 0.8); low.note(12, 'C1', 4, 0.7);
    [[1, 'G4'], [3.5, 'Eb4'], [5.5, 'D4'], [8.5, 'C5'], [11.2, 'Bb4'], [13, 'G4'], [14.5, 'Eb4']].forEach(([b, p]) => pno.note(b, p, 2.5, 0.45));
    // thunder arrives late: sound is slower than light
    for (const f of FL) { th.hit(M.b(f.t + f.d), 0.4 + 0.6 * f.s, 4); if (f.bolt) crack.hit(M.b(f.t + f.d - 0.08), f.s, 1.5); }
    return M;
  },

  setup() {
    sh = Stage.shader({ frag: FRAG, z: 1 }); ctx = Stage.canvas2d({ z: 2 });
    FL.forEach((f, i) => { if (!f.bolt) return; f.bolts = []; for (let k = 0; k < f.bolt; k++) { const gx = f.x + (k - (f.bolt - 1) / 2) * 250 + (hash(i, k) - 0.5) * 120; f.bolts.push(makeBolt(f.x + (k - (f.bolt - 1) / 2) * 40, f.y + 60, gx, HOR - 4 - 20 * hash(i, k + 5), 500 + i * 31 + k * 7, 0)); } });
  },

  frame(t) {
    // the three strongest glows right now
    const act = FL.map((f) => ({ f, e: env(t - f.t) * f.s })).filter((a) => a.e > 0.004).sort((a, b) => b.e - a.e).slice(0, 3), U = new Float32Array(12);
    act.forEach((a, i) => { U[i * 4] = a.f.x / W; U[i * 4 + 1] = 1 - a.f.y / H; U[i * 4 + 2] = a.e * 1.25; U[i * 4 + 3] = 0.30 + 0.16 * a.f.s; });
    sh.draw(t, { 'uF[0]': { v4: U } });
    const c = ctx; c.clearRect(0, 0, W, H);
    const total = act.reduce((s, a) => s + a.e, 0);
    // the plain: dark, with a faint sheen when the sky lights
    const g = c.createLinearGradient(0, HOR, 0, H); g.addColorStop(0, `rgb(${Math.round(12 + 44 * total)},${Math.round(13 + 46 * total)},${Math.round(22 + 62 * total)})`); g.addColorStop(1, '#06070d'); c.fillStyle = g; c.fillRect(0, HOR, W, H - HOR);
    c.strokeStyle = `rgba(150,160,210,${0.10 + 0.25 * total})`; c.lineWidth = 1; c.beginPath(); c.moveTo(0, HOR + 0.5); c.lineTo(W, HOR + 0.5); c.stroke();
    // silhouettes: telegraph poles receding along a road, wires, and one tree
    c.fillStyle = '#05060b'; c.strokeStyle = '#05060b';
    for (let k = 0; k < 9; k++) { const u = k / 8, x = lerp(240, 1150, 1 - Math.pow(1 - u, 2.2)), hh = lerp(250, 20, Math.pow(u, 0.6)), wv = lerp(7, 1.2, u); c.fillRect(x - wv / 2, HOR - hh, wv, hh + 4); c.fillRect(x - hh * 0.16, HOR - hh * 0.93, hh * 0.32, Math.max(1.5, wv * 0.6)); if (k < 8) { const u2 = (k + 1) / 8, x2 = lerp(240, 1150, 1 - Math.pow(1 - u2, 2.2)), h2 = lerp(250, 20, Math.pow(u2, 0.6)); c.lineWidth = Math.max(0.6, 1.6 * (1 - u)); for (const sd of [-0.15, 0.15]) { c.beginPath(); c.moveTo(x + hh * sd, HOR - hh * 0.93); c.quadraticCurveTo((x + x2) / 2, HOR - (hh + h2) * 0.43, x2 + h2 * sd, HOR - h2 * 0.93); c.stroke(); } } }
    const tree = (x, y, a, len, w, d) => { const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len; c.lineWidth = w; c.lineCap = 'round'; c.beginPath(); c.moveTo(x, y); c.lineTo(x2, y2); c.stroke(); if (d > 6) return; for (let k = 0; k < 2; k++) tree(x2, y2, a + (k - 0.5) * (0.85 - d * 0.04) + (hash(d * 13 + k, Math.round(x2)) - 0.5) * 0.5 + 0.06, len * 0.72, Math.max(0.8, w * 0.64), d + 1); };
    tree(1560, HOR + 6, -Math.PI / 2 - 0.08, 96, 12, 0);
    // bolts: a wide soft glow under a fine core, fading with the flash
    c.save(); c.beginPath(); c.rect(0, 0, W, HOR + 1); c.clip();
    for (const f of FL) { if (!f.bolts) continue; const a = t - f.t, e = env(a) * Math.exp(-Math.max(0, a) / 0.4); if (e < 0.01) continue; c.globalCompositeOperation = 'lighter';
      const draw = (b, k) => { c.beginPath(); b.pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.lineWidth = b.w * k; c.stroke(); b.forks.forEach((q) => draw(q, k)); };
      f.bolts.forEach((b, k) => { const ee = clamp01(e * (k === 1 || f.bolts.length === 1 ? 1 : 0.8) * 1.15) * (a > k * 0.05 ? 1 : 0); if (ee <= 0) return; c.lineJoin = 'round'; c.lineCap = 'round'; c.filter = 'blur(14px)'; c.strokeStyle = `rgba(150,160,255,${0.5 * ee})`; draw(b, 6); c.filter = 'blur(3px)'; c.strokeStyle = `rgba(190,200,255,${0.7 * ee})`; draw(b, 2); c.filter = 'none'; c.strokeStyle = `rgba(240,242,255,${ee})`; draw(b, 0.8);
        // where it lands
        const end = b.pts[b.pts.length - 1], gg = c.createRadialGradient(end[0], end[1], 0, end[0], end[1], 260); gg.addColorStop(0, `rgba(190,200,255,${0.36 * ee})`); gg.addColorStop(1, 'rgba(190,200,255,0)'); c.fillStyle = gg; c.fillRect(end[0] - 260, end[1] - 260, 520, 520); });
      c.globalCompositeOperation = 'source-over'; }
    c.restore();
    // thin rain close to the lens
    c.strokeStyle = `rgba(170,180,220,${0.05 + 0.10 * total})`; c.lineWidth = 1; c.beginPath(); for (let i = 0; i < 140; i++) { const sp = 1500 + 700 * hash(i, 1), y = Stage.mod(hash(i, 2) * 1400 + t * sp, H + 200) - 100, x = hash(i + Math.floor((hash(i, 2) * 1400 + t * sp) / (H + 200)) * 131, 3) * W; c.moveTo(x, y); c.lineTo(x - 8, y + 46); } c.stroke();
  }
});
</script>
</body>
</html>
