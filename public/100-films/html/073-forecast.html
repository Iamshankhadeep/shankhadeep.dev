<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nº 073 — Forecast</title>
<link rel="stylesheet" href="../lib/fonts/fonts.css">
<script src="../lib/stage.js"></script>
<script src="../lib/synth.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
/* Nº 073 — FORECAST
 * A UI motion study: one glass card, four invented cities, four skies. The sky is full-bleed and alive (sun
 * and drifting cloud, rain, snow, stars); the card frosts whatever is behind it. On each swipe the content
 * leaves and arrives element by element with staggered easing, the temperature numerals roll, the line icon
 * turns over, the hourly curve re-draws. At the end the card folds itself into an app icon.
 * Swipes land on beats 9, 18 and 27; ten bars at 120 bpm (2 s each). */
const { ease: E, prog, win, clamp01, lerp, smoothstep, hash } = Stage;
const W = 1920, H = 1080, TAU = Math.PI * 2, CW = 430, CH = 830, CX = 960, CY = 532, SWIPE = [4.5, 9.0, 13.5], SW_DUR = 1.0, T_ICON = 17.5;
const CITY = [
  { name: 'Caldera Bay', when: 'Tuesday · 08:00', temp: '24°', cond: 'Clear morning', hilo: 'H 26°   L 17°', hours: ['08', '09', '10', '11', '12', '13'], v: [0.25, 0.42, 0.6, 0.78, 0.9, 0.82], ink: '20,36,70' },
  { name: 'Port Halloway', when: 'Tuesday · 14:00', temp: '11°', cond: 'Steady rain', hilo: 'H 12°   L 8°', hours: ['14', '15', '16', '17', '18', '19'], v: [0.75, 0.62, 0.6, 0.45, 0.42, 0.25], ink: '255,255,255' },
  { name: 'Vinterholm', when: 'Tuesday · 17:00', temp: '−3°', cond: 'Light snow', hilo: 'H −1°   L −6°', hours: ['17', '18', '19', '20', '21', '22'], v: [0.8, 0.66, 0.5, 0.5, 0.34, 0.2], ink: '28,44,74' },
  { name: 'Lumen Heights', when: 'Tuesday · 22:00', temp: '16°', cond: 'Clear night', hilo: 'H 19°   L 13°', hours: ['22', '23', '00', '01', '02', '03'], v: [0.85, 0.7, 0.55, 0.4, 0.28, 0.25], ink: '255,255,255' }
];
let ctx, SB, cloud, moon;

function sky(c, i, t) {
  const g = c.createLinearGradient(0, 0, 0, H), st = [['#5e9df0', '#a9c8f5', '#ffd0ac'], ['#27303d', '#3d4b5e', '#5a6a7e'], ['#93a8c2', '#b9c8da', '#dde5ee'], ['#060818', '#12164a', '#2a2f7a']][i];
  g.addColorStop(0, st[0]); g.addColorStop(0.55, st[1]); g.addColorStop(1, st[2]); c.fillStyle = g; c.fillRect(0, 0, W, H);
  if (i === 0) {   // sun and slow cloud
    const sx = 1420, sy = 330 - 10 * t, sg = c.createRadialGradient(sx, sy, 0, sx, sy, 520); sg.addColorStop(0, 'rgba(255,250,230,1)'); sg.addColorStop(0.12, 'rgba(255,238,200,.95)'); sg.addColorStop(0.16, 'rgba(255,226,180,.5)'); sg.addColorStop(1, 'rgba(255,220,170,0)'); c.fillStyle = sg; c.fillRect(0, 0, W, H);
    for (let k = 0; k < 6; k++) { const x = Stage.mod(hash(k, 1) * 2600 + t * (12 + 10 * hash(k, 2)), 2600) - 400, y = 560 + 360 * hash(k, 3), s = 0.7 + 0.9 * hash(k, 4); c.globalAlpha = 0.6; c.drawImage(cloud.canvas, x, y, 520 * s, 200 * s); } c.globalAlpha = 1;
  } else if (i === 1) {   // cloud bank and rain
    for (let k = 0; k < 9; k++) { const x = Stage.mod(hash(k, 5) * 2700 + t * (20 + 16 * hash(k, 6)), 2700) - 500, y = -80 + 240 * hash(k, 7), s = 1.2 + hash(k, 8); c.globalAlpha = 0.28; c.drawImage(cloud.canvas, x, y, 620 * s, 240 * s); } c.globalAlpha = 1;
    c.strokeStyle = 'rgba(210,225,245,.34)'; c.lineWidth = 2; c.lineCap = 'round'; c.beginPath(); for (let k = 0; k < 240; k++) { const z = 0.5 + hash(k, 9), x = Stage.mod(hash(k, 10) * 2200 - t * 160 * z, 2200) - 140, y = Stage.mod(hash(k, 11) * 1300 + t * 1250 * z, 1300) - 110, l = 36 * z; c.moveTo(x, y); c.lineTo(x - l * 0.13, y + l); } c.stroke();
  } else if (i === 2) {   // snow in three depths
    for (let k = 0; k < 170; k++) { const z = hash(k, 12), x = Stage.mod(hash(k, 13) * 2100 + 50 * Math.sin(t * (0.5 + z) + k) + t * 16, 2100) - 90, y = Stage.mod(hash(k, 14) * 1250 + t * (60 + 140 * z), 1250) - 80, r = 2 + 7 * z * z; c.fillStyle = `rgba(255,255,255,${0.35 + 0.5 * z})`; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }
  } else {   // stars and a moon
    for (let k = 0; k < 190; k++) { const x = hash(k, 15) * W, y = Math.pow(hash(k, 16), 1.5) * H * 0.9, tw = 0.5 + 0.5 * Math.sin(t * (1 + 2 * hash(k, 17)) + k); c.fillStyle = `rgba(230,236,255,${(0.25 + 0.6 * hash(k, 18)) * (0.5 + 0.5 * tw)})`; c.beginPath(); c.arc(x, y, 0.8 + 1.6 * hash(k, 19), 0, TAU); c.fill(); }
    const mx = 470, my = 280, mg = c.createRadialGradient(mx, my, 40, mx, my, 380); mg.addColorStop(0, 'rgba(200,210,255,.28)'); mg.addColorStop(1, 'rgba(200,210,255,0)'); c.fillStyle = mg; c.fillRect(0, 0, W, H);
    c.drawImage(moon.canvas, mx - 70, my - 70);
  }
}
// line icons, 5 px stroke, drawn around (0,0)
function cloudPath(c) { c.beginPath(); c.moveTo(-46, 22); c.arc(-46, 0, 22, Math.PI / 2, Math.PI * 1.5); c.arc(-14, -14, 32, Math.PI * 1.08, Math.PI * 1.9); c.arc(34, 0, 22, Math.PI * 1.45, Math.PI / 2); c.closePath(); }
function icon(c, i, t) {
  c.lineWidth = 5.5; c.lineCap = 'round'; c.lineJoin = 'round';
  if (i === 0) { c.beginPath(); c.arc(0, 0, 30, 0, TAU); c.stroke(); for (let k = 0; k < 8; k++) { const a = k * TAU / 8 + t * 0.4; c.beginPath(); c.moveTo(Math.cos(a) * 46, Math.sin(a) * 46); c.lineTo(Math.cos(a) * 62, Math.sin(a) * 62); c.stroke(); } }
  else if (i === 1) { c.save(); c.translate(0, -16); cloudPath(c); c.stroke(); c.restore(); for (let k = 0; k < 3; k++) { const p = Stage.mod(t * 1.6 + k * 0.33, 1), x = -30 + k * 30, y = 22 + p * 36; c.globalAlpha *= Math.sin(Math.PI * p); c.beginPath(); c.moveTo(x, y); c.lineTo(x - 5, y + 16); c.stroke(); c.globalAlpha /= Math.max(1e-3, Math.sin(Math.PI * p)); } }
  else if (i === 2) { c.save(); c.translate(0, -16); cloudPath(c); c.stroke(); c.restore(); for (let k = 0; k < 3; k++) { const p = Stage.mod(t * 0.7 + k * 0.33, 1), x = -30 + k * 30 + 5 * Math.sin(t * 2 + k), y = 26 + p * 40, al = Math.sin(Math.PI * p); c.globalAlpha *= al; c.beginPath(); c.arc(x, y, 4, 0, TAU); c.fill(); c.globalAlpha /= Math.max(1e-3, al); } }
  else { c.beginPath(); c.arc(-6, 4, 40, Math.PI * 0.3, Math.PI * 1.55); c.arc(18, -16, 36, Math.PI * 1.3, Math.PI * 0.52, true); c.closePath(); c.stroke(); for (const [x, y, s, ph] of [[44, -40, 9, 0], [58, 6, 6, 2]]) { const k = 0.6 + 0.4 * Math.sin(t * 3 + ph); c.beginPath(); c.moveTo(x - s * k, y); c.lineTo(x + s * k, y); c.moveTo(x, y - s * k); c.lineTo(x, y + s * k); c.stroke(); } }
}

Stage.create({
  no: 73, title: 'Forecast', subtitle: 'four cities, four skies · 120 bpm',
  duration: 20, background: '#5e9df0', grain: 0.035, poster: 7.4,
  fonts: ['300 168px "Manrope Variable"', '600 30px "Manrope Variable"', '500 19px "Manrope Variable"', '600 24px "Manrope Variable"'],
  fade: { in: 0.7, out: 1.0 },
  slate: { at: 0.6, hold: 2.6, pos: 'bl', shadow: true },

  music(S) {
    const M = S.score({ bpm: 120, duration: 20, seed: 73 });
    M.master({ reverb: { decay: 1.8, size: 0.85, damp: 0.5 }, fadeOut: 1.2 });
    const kick = M.track('softkick', { reverb: 0.05, gain: 0.7 }), hat = M.track('hat', { reverb: 0.1, gain: 0.2 }), stab = M.track('stab', { reverb: 0.4, gain: 0.5, lowpass: 2600, delay: { time: 0.75, fb: 0.3, mix: 0.2 }, duck: { by: 'softkick', depth: 0.3 } }), kal = M.track('kalimba', { reverb: 0.4, gain: 0.7, humanize: 0 }), wh = M.track('whoosh', { reverb: 0.3, gain: 0.34 }), sub = M.track('sub', { reverb: 0.05, gain: 0.4 }), pad = M.track('warmpad', { reverb: 0.6, gain: 0.3 });
    const bars = [['A1', ['A3', 'C#4', 'E4', 'G#4']], ['F#1', ['F#3', 'A3', 'C#4', 'E4']], ['D2', ['D3', 'F#3', 'A3', 'C#4']], ['E2', ['E3', 'G#3', 'B3', 'D4']]];
    for (let bar = 0; bar < 10; bar++) {
      const b = bar * 4, [r, ch] = bars[bar % 4], last = bar === 9;
      pad.chord(b, ch, 4, 0.4); if (!last) { [0.5, 1.5, 2.5, 3.5].forEach((o, i) => stab.chord(b + o, ch, 0.22, 0.5 - 0.04 * i)); if (bar >= 1) { kick.pattern(b, 1, 'xxxx', { vel: 0.85 }); hat.pattern(b, 0.5, '.x.x.x.x', { vel: 0.5 }); sub.note(b, r, 0.8, 0.7); sub.note(b + 2.5, r, 0.6, 0.55); } }
      else { stab.chord(b, bars[0][1], 1.5, 0.5); sub.note(b, 'A1', 3, 0.6); }
    }
    // UI ticks: content landing after each swipe, and the hourly dots
    const sc = S.scale('A4', 'pentatonic', 2);
    [0.9, ...SWIPE.map((s) => s + 0.45)].forEach((t0, k) => [0, 1, 2, 3, 4, 5].forEach((i) => kal.note(M.b(t0 + i * 0.09), sc[(i + k * 2) % sc.length], 0.3, 0.42)));
    SWIPE.forEach((s) => wh.hit(M.b(s - 0.12), 0.7, 0.9)); wh.hit(M.b(T_ICON - 0.1), 0.8, 1.2); kal.note(M.b(T_ICON + 1.1), 'A5', 1, 0.6); kal.note(M.b(T_ICON + 1.22), 'E6', 1.5, 0.55);
    return M;
  },

  setup() {
    ctx = Stage.canvas2d({ z: 1, dpr: 2 }); SB = Stage.buffer(W, H);
    moon = Stage.buffer(140, 140); moon.fillStyle = '#eef0ff'; moon.beginPath(); moon.arc(70, 70, 62, 0, TAU); moon.fill(); moon.globalCompositeOperation = 'destination-out'; moon.beginPath(); moon.arc(100, 54, 56, 0, TAU); moon.fill(); moon.globalCompositeOperation = 'source-over';
    cloud = Stage.buffer(520, 200); for (const [x, y, r] of [[130, 120, 80], [230, 90, 90], [340, 110, 84], [420, 130, 60], [80, 140, 50], [280, 140, 70]]) { const g = cloud.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(255,255,255,.75)'); g.addColorStop(1, 'rgba(255,255,255,0)'); cloud.fillStyle = g; cloud.fillRect(x - r, y - r, r * 2, r * 2); }
  },

  frame(t) {
    // which city, and how far through a swipe
    let idx = 0, P = 0; SWIPE.forEach((s, k) => { if (t >= s + SW_DUR) idx = k + 1; else if (t >= s) { idx = k; P = (t - s) / SW_DUR; } });
    const nxt = Math.min(3, idx + 1), skyMix = E.inOutCubic(clamp01(P * 1.15));
    const sb = SB; sb.globalAlpha = 1; sky(sb, idx, t); if (P > 0) { sb.globalAlpha = skyMix; sb.save(); sb.beginPath(); sb.rect(0, 0, W, H); sb.clip(); sky(sb, nxt, t); sb.restore(); sb.globalAlpha = 1; }
    const c = ctx; c.clearRect(0, 0, W, H); c.globalAlpha = 1; c.drawImage(sb.canvas, 0, 0);
    // the card's rectangle: nudged by each swipe; folding into an icon at the end
    const ic = prog(t, T_ICON, 1.1, E.inOutCubic), pop = t > T_ICON + 1.0 ? 1 + 0.08 * Math.exp(-(t - T_ICON - 1.0) * 7) * Math.sin((t - T_ICON - 1.0) * 22) : 1, nudge = -26 * Math.sin(Math.PI * clamp01(P)) * (1 - ic);
    const w = lerp(CW, 236, ic) * pop, h = lerp(CH, 236, ic) * pop, x = CX - w / 2 + nudge, y = lerp(CY, 500, ic) - h / 2, rad = lerp(58, 56, ic), dim = idx === 3 || (idx === 2 && P > 0.5) ? 0 : 0;
    if (ic > 0) { c.fillStyle = `rgba(8,10,30,${0.35 * ic})`; c.fillRect(0, 0, W, H); }
    // shadow, frosted glass, edge light
    c.save(); c.shadowColor = 'rgba(10,20,50,.35)'; c.shadowBlur = 70; c.shadowOffsetY = 34; c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.roundRect(x + 14, y + 20, w - 28, h - 28, rad); c.fill(); c.restore();
    c.save(); c.beginPath(); c.roundRect(x, y, w, h, rad); c.clip(); c.filter = 'blur(26px)'; c.drawImage(sb.canvas, x - 80, y - 80, w + 160, h + 160, x - 80, y - 80, w + 160, h + 160); c.filter = 'none';
    const ink0 = CITY[idx].ink, ink1 = CITY[nxt].ink, darkInk = (P > 0.5 ? ink1 : ink0) !== '255,255,255';
    c.fillStyle = darkInk ? 'rgba(255,255,255,.34)' : 'rgba(255,255,255,.13)'; c.fillRect(x, y, w, h);
    const sheen = c.createLinearGradient(x, y, x + w, y + h); sheen.addColorStop(0, 'rgba(255,255,255,.22)'); sheen.addColorStop(0.4, 'rgba(255,255,255,0)'); c.fillStyle = sheen; c.fillRect(x, y, w, h);
    if (ic > 0) { const ig = c.createLinearGradient(0, y, 0, y + h); ig.addColorStop(0, `rgba(94,157,240,${ic})`); ig.addColorStop(1, `rgba(255,200,160,${ic})`); c.fillStyle = ig; c.fillRect(x, y, w, h); }
    // content: both cities during a swipe, each element with its own delay
    const contentA = 1 - clamp01(ic * 3.5);
    if (contentA > 0) for (const pass of P > 0 ? [0, 1] : [0]) {
      const city = CITY[pass ? nxt : idx], ink = city.ink, el = (e) => { const d = e * 0.065; if (P <= 0) return [0, 1]; if (!pass) { const po = E.inCubic(clamp01((P - d) / 0.42)); return [-110 * po, 1 - po]; } const pi = E.outCubic(clamp01((P - 0.34 - d) / 0.5)); return [110 * (1 - pi), pi]; };
      const set = (e, a = 1) => { const [dx, al] = el(e); c.globalAlpha = al * a * contentA; return dx; };
      const L = x + 44, R = x + w - 44, MX = x + w / 2; c.textBaseline = 'alphabetic';
      let dx = set(0); c.fillStyle = `rgba(${ink},1)`; c.font = '600 30px "Manrope Variable"'; c.textAlign = 'left'; c.fillText(city.name, L + 30 + dx, y + 92); c.strokeStyle = `rgba(${ink},1)`; c.lineWidth = 2.6; c.beginPath(); c.arc(L + 9 + dx, y + 78, 8, Math.PI * 0.85, Math.PI * 2.15); c.lineTo(L + 9 + dx, y + 96); c.closePath(); c.stroke(); c.beginPath(); c.arc(L + 9 + dx, y + 78, 2.4, 0, TAU); c.fill();
      for (let k = 0; k < 3; k++) { c.beginPath(); c.arc(R - 4 - k * 11 + dx, y + 82, 2.6, 0, TAU); c.fill(); }
      dx = set(1, 0.72); c.font = '500 19px "Manrope Variable"'; c.fillText(city.when, L + dx, y + 128);
      // icon turns over
      { const [d2, al] = el(2); c.save(); c.globalAlpha = al * contentA; c.translate(MX + d2 * 0.5, y + 262); c.rotate((pass ? 1 : -1) * 0.6 * (1 - al)); const s = 1.5 * (0.6 + 0.4 * al); c.scale(s, s); c.strokeStyle = `rgba(${ink},1)`; c.fillStyle = `rgba(${ink},1)`; icon(c, pass ? nxt : idx, t); c.restore(); }
      // temperature: numerals roll
      { c.save(); c.beginPath(); c.rect(x, y + 372, w, 190); c.clip(); c.font = '300 168px "Manrope Variable"'; c.textAlign = 'center'; c.fillStyle = `rgba(${ink},1)`; const chars = city.temp.split(''), ws = chars.map((ch) => c.measureText(ch).width), tot = ws.reduce((a, b2) => a + b2, 0); let xx = MX - tot / 2 + 10;
        chars.forEach((ch, k) => { const d = 0.08 * k; let oy = 0, al = 1; if (P > 0) { if (!pass) { const po = E.inCubic(clamp01((P - 0.1 - d) / 0.4)); oy = -170 * po; al = 1 - po; } else { const pi = E.outBack(clamp01((P - 0.36 - d) / 0.5)); oy = 170 * (1 - pi); al = clamp01(pi * 1.5); } } c.globalAlpha = al * contentA; c.textAlign = 'left'; c.fillText(ch, xx, y + 530 + oy); xx += ws[k]; }); c.restore(); }
      dx = set(4); c.textAlign = 'center'; c.fillStyle = `rgba(${ink},1)`; c.font = '600 24px "Manrope Variable"'; c.fillText(city.cond, MX + dx, y + 590);
      dx = set(5, 0.7); c.font = '500 19px "Manrope Variable"'; c.fillText(city.hilo, MX + dx, y + 622);
      // hourly labels (the curve itself is shared and morphs)
      dx = set(6, 0.62); c.font = '500 19px "Manrope Variable"'; city.hours.forEach((hh, k) => c.fillText(hh, L + 10 + k * (w - 108) / 5 + dx, y + 778));
    }
    if (contentA > 0) {   // hourly curve: values glide from one city to the next; the head re-draws after each swipe
      c.globalAlpha = contentA; const m = E.inOutCubic(clamp01((P - 0.2) / 0.6)), L = x + 54, cw = w - 108, y0 = y + 742, ch = 62, ink = (P > 0.5 ? CITY[nxt] : CITY[idx]).ink;
      const pt = (k) => [L + k * cw / 5, y0 - ch * lerp(CITY[idx].v[k], CITY[nxt].v[k], P > 0 ? m : 0)], last = [0.3, ...SWIPE.map((s) => s + 0.5)].filter((s) => t >= s).pop(), dr = last == null ? 0 : E.outCubic(clamp01((t - last) / 0.9));
      c.strokeStyle = `rgba(${ink},.9)`; c.lineWidth = 3; c.lineJoin = 'round'; c.lineCap = 'round'; c.save(); c.beginPath(); c.rect(x, y + 640, 54 + cw * dr + 6, 130); c.clip(); c.beginPath(); for (let k = 0; k < 6; k++) { const p = pt(k); if (!k) c.moveTo(p[0], p[1]); else { const q = pt(k - 1), mx2 = (p[0] + q[0]) / 2; c.bezierCurveTo(mx2, q[1], mx2, p[1], p[0], p[1]); } } c.stroke();
      for (let k = 0; k < 6; k++) { const p = pt(k); c.fillStyle = k === 0 ? '#7df2c4' : `rgba(${ink},1)`; c.beginPath(); c.arc(p[0], p[1], k === 0 ? 6.5 : 4, 0, TAU); c.fill(); } c.restore(); c.globalAlpha = 1;
    }
    // the icon's glyph
    if (ic > 0.5) { const a = smoothstep(0.55, 1, ic); c.globalAlpha = a; c.save(); c.translate(x + w / 2, y + h / 2); c.scale(pop * 1.25, pop * 1.25); c.strokeStyle = '#fff'; c.fillStyle = '#fff'; c.lineWidth = 6; c.lineCap = 'round'; c.beginPath(); c.arc(22, -22, 22, 0, TAU); c.stroke(); c.save(); c.translate(-6, 18); c.scale(0.9, 0.9); cloudPath(c); c.fillStyle = 'rgba(160,190,240,1)'; c.fill(); c.lineWidth = 6.6; c.stroke(); c.restore(); c.restore(); c.globalAlpha = 1; }
    c.restore();
    c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 1.5; c.beginPath(); c.roundRect(x + 0.75, y + 0.75, w - 1.5, h - 1.5, rad); c.stroke();
    // page dots under the card; label under the icon
    const pa = (1 - clamp01(ic * 3)) * prog(t, 0.6, 0.6); if (pa > 0) for (let k = 0; k < 4; k++) { const act = k === idx ? 1 - E.inOutCubic(P) : k === nxt && P > 0 ? E.inOutCubic(P) : 0, wd = lerp(9, 30, act), xx = CX - 60 + k * 36 + (k > idx ? 0 : 0); c.fillStyle = `rgba(255,255,255,${(0.4 + 0.55 * act) * pa})`; c.beginPath(); c.roundRect(xx - wd / 2, 992, wd, 9, 4.5); c.fill(); }
    const la = prog(t, T_ICON + 0.9, 0.6, E.outCubic); if (la > 0) { c.globalAlpha = la; c.fillStyle = '#fff'; c.font = '600 30px "Manrope Variable"'; c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.fillText('Forecast', CX, 672 + 8 * (1 - la)); c.globalAlpha = 1; }
  }
});
</script>
</body>
