const P_LEAP = (u) => ({ hipH: 84, lift: 150 * 4 * u * (1 - u), body: -0.38 + 0.85 * u, neck: -0.25, head: 0.1 + 0.2 * u, tail: 0.35, mouth: 0.7, feet: [[lerp(-74, 10, u), lerp(34, 78, u), 1], [lerp(-60, 0, u), lerp(40, 78, u), 1], [lerp(78, 40, u), lerp(8, 80, u), 1], [lerp(84, 54, u), lerp(-2, 78, u), 1]] });
