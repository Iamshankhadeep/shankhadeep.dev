<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nº 080 — Oko & Vale</title>
<link rel="stylesheet" href="../lib/fonts/fonts.css">
<script src="../lib/stage.js"></script>
<script src="../lib/synth.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
/* Nº 080 — OKO & VALE
 * Ident for a design studio that doesn't exist: a circle, an arch and a square play, collide and click into
 * a monogram. Each shape follows a hand-written list of hops (parabolic arcs between two rests), and the
 * character comes from three rules applied to every hop: stretch along the direction of travel, squash on
 * landing with a damped ring, and a shadow that tightens as the shape nears the floor. The tumble leaves the
 * arch upside-down and the square on its corner — which is exactly the O ◆ V of the lockup, on the downbeat
 * of bar 6. Every landing is a note. Seven bars at 120 bpm (2 s each). */
const { ease: E, prog, win, clamp01, lerp, smoothstep, hash } = Stage;
const W = 1920, H = 1080, TAU = Math.PI * 2, FLOOR = 724, T_LOCK = 10, TOMATO = '#e5523a', COBALT = '#2a49d6', MUSTARD = '#ecb53a', INK = '#1d1b22';
// hops: [t0, t1, x0, y0, x1, y1, arc height, rotation at end] (y = centre). Between hops a shape rests where it landed.
const C_R = 86, A_H = 190, S_S = 150, CY = FLOOR - C_R, AY = FLOOR - A_H / 2, SY = FLOOR - S_S / 2;
const HOPS = {
  circle: [[0, 0.5, -140, 240, 330, CY, 60, 0], [0.5, 1.0, 330, CY, 620, CY, 270, 0], [1.0, 1.4, 620, CY, 820, CY, 150, 0], [1.4, 1.7, 820, CY, 930, CY, 64, 0],
    [4.0, 4.6, 930, CY, 1250, AY - A_H / 2 - C_R, 190, 0], [4.6, 5.2, 1250, AY - A_H / 2 - C_R, 1250, AY - A_H / 2 - C_R, 140, 0], [5.2, 5.8, 1250, AY - A_H / 2 - C_R, 600, SY - S_S / 2 - C_R, 170, 0], [5.8, 6.3, 600, SY - S_S / 2 - C_R, 600, SY - S_S / 2 - C_R, 150, 0],
    [6.3, 6.9, 600, SY - S_S / 2 - C_R, 960, AY - A_H / 2 - C_R, 130, 0], [8.3, 8.9, 960, AY - A_H / 2 - C_R, 1440, CY, 90, 0], [8.9, 9.3, 1440, CY, 1560, CY, 110, 0], [9.5, 10.0, 1560, CY, 716, 430, 330, 0]],
  arch: [[2.0, 2.5, 2060, AY, 1640, AY, 170, 0], [2.5, 3.0, 1640, AY, 1250, AY, 140, 0], [6.0, 6.5, 1250, AY, 960, AY, 120, 0], [8.25, 9.0, 960, AY, 500, AY, 300, Math.PI], [9.5, 10.0, 500, AY, 1204, 430, 300, Math.PI]],
  square: [[4.15, 4.6, 600, -140, 600, SY, 0, 0], [6.45, 7.0, 600, SY, 960, AY - A_H / 2 - C_R * 2 - S_S / 2 + 6, 110, 0.16], [8.35, 9.05, 960, AY - A_H / 2 - C_R * 2 - S_S / 2 + 6, 1000, FLOOR - S_S * 0.707, 60, Math.PI * 2.25], [9.5, 10.0, 1000, FLOOR - S_S * 0.707, 960, 430, 220, Math.PI * 2.25]]
};
// things that land ON a shape make it flinch: [time, shape, amount]
const PRESS = [[4.6, 'arch', 0.3], [5.2, 'arch', 0.24], [5.8, 'square', 0.3], [6.3, 'square', 0.22], [6.9, 'arch', 0.26], [7.0, 'arch', 0.18], [7.0, 'circle', 0.2]];
function pose(name, t) {
  const hs = HOPS[name]; let x = hs[0][2], y = hs[0][3], rot = 0, sx = 1, sy = 1, vis = t >= hs[0][0], air = 0, lastRot = 0;
  for (const h of hs) {
    const [t0, t1, x0, y0, x1, y1, ht, r1] = h;
    if (t >= t1) { x = x1; y = y1; rot = r1; lastRot = r1; const dt = t - t1, q = ht > 0 || y0 < 0 ? 0.3 : 0.12, k = q * Math.exp(-dt * 11) * Math.cos(dt * 30); if (dt < 0.6) { sy = 1 - k; sx = 1 + k * 0.8; } else { sx = 1; sy = 1; } air = 0; }
    else if (t >= t0) { const u = (t - t0) / (t1 - t0), uy = y0 < 0 ? u * u : u; x = lerp(x0, x1, u); y = lerp(y0, y1, uy) - ht * 4 * u * (1 - u); rot = lerp(lastRot, r1, E.inOutSine(u));
      const vy = Math.abs((y1 - y0) * (y0 < 0 ? 2 * u : 1) - ht * 4 * (1 - 2 * u)) / (t1 - t0), st = Math.min(0.22, vy / 6000), ant = u < 0.12 ? (1 - u / 0.12) * 0.18 : 0; sy = 1 + st - ant; sx = 1 - st * 0.7 + ant * 0.7; air = 4 * u * (1 - u); break; }
  }
  for (const [tp, who, a] of PRESS) if (who === name && t >= tp && t < tp + 0.6) { const dt = t - tp, k = a * Math.exp(-dt * 10) * Math.cos(dt * 28); sy *= 1 - k; sx *= 1 + k * 0.7; }
  // the precarious stack wobbles, more and more
  if (t > 7.0 && t < 8.35) { const w = smoothstep(7.0, 8.3, t), s = Math.sin((t - 7) * 9) * w; if (name === 'circle') x += 16 * s; if (name === 'square') { x += 44 * s; rot += 0.16 * s; } if (name === 'arch') rot = 0.035 * s; }
  return { x, y, rot, sx, sy, vis, air };
}
let ctx;
function shape(c, name, sc = 1) {
  if (name === 'circle') { c.fillStyle = TOMATO; c.beginPath(); c.arc(0, 0, C_R * sc, 0, TAU); c.fill(); }
  else if (name === 'square') { const s = S_S * sc; c.fillStyle = MUSTARD; c.beginPath(); c.roundRect(-s / 2, -s / 2, s, s, 10 * sc); c.fill(); }
  else { const o = 95 * sc, i = 43 * sc, h = A_H / 2 * sc; c.fillStyle = COBALT; c.beginPath(); c.moveTo(-o, h); c.lineTo(-o, 0); c.arc(0, 0, o, Math.PI, 0); c.lineTo(o, h); c.lineTo(i, h); c.lineTo(i, 0); c.arc(0, 0, i, 0, Math.PI, true); c.lineTo(-i, h); c.closePath(); c.fill(); }
}

Stage.create({
  no: 80, title: 'Oko & Vale', subtitle: 'studio ident · 120 bpm',
  duration: 14, background: '#f3eee2', grain: 0.04, poster: 11.8,
  fonts: ['800 104px "Bricolage Grotesque Variable"', '500 28px "Bricolage Grotesque Variable"'],
  fade: { in: 0.4, out: 0.9, color: '#f3eee2' },
  slate: { at: 0.3, hold: 2.2, pos: 'bl', color: 'rgba(29,27,34,.82)' },

  music(S) {
    const M = S.score({ bpm: 120, duration: 14, seed: 80 });
    M.master({ reverb: { decay: 1.2, size: 0.7, damp: 0.5 }, fadeOut: 0.9 });
    const mar = M.track('marimba', { reverb: 0.25, gain: 0.9, humanize: 0 }), bass = M.track('pluck', { reverb: 0.15, gain: 0.8, params: { decay: 0.7, bright: 0.3 }, humanize: 0 }), wb = M.track('woodblock', { reverb: 0.2, gain: 0.55, humanize: 0 }), clap = M.track('clap', { reverb: 0.25, gain: 0.5 }), kal = M.track('kalimba', { reverb: 0.45, gain: 0.8 }), sh = M.track('shaker', { reverb: 0.1, gain: 0.2 }), kick = M.track('softkick', { reverb: 0.05, gain: 0.6 });
    const sc = S.scale('F4', 'major', 2), low = S.scale('F2', 'major', 2);
    // every landing is a note: the circle sings, the arch thumps, the square knocks
    HOPS.circle.forEach((h, i) => { if (h[1] < T_LOCK) mar.note(M.b(h[1]), sc[[0, 2, 4, 7, 9, 7, 4, 2, 5, 3, 1, 0][i]], 0.5, 0.7); });
    HOPS.arch.forEach((h, i) => { if (h[1] < T_LOCK) { bass.note(M.b(h[1]), low[[0, 4, 3, 0][i]], 0.6, 0.8); wb.hit(M.b(h[1]), 0.6, 0.1, { pitch: 50 }); } });
    HOPS.square.forEach((h, i) => { if (h[1] < T_LOCK) { wb.hit(M.b(h[1]), 0.9, 0.1, { pitch: 62 }); kick.hit(M.b(h[1]), 0.8); } });
    // groove under the play section
    for (let bar = 2; bar < 5; bar++) { const b = bar * 4, r = [0, 3, 4][bar - 2]; bass.note(b, low[r], 0.6, 0.6); bass.note(b + 1.5, low[r + 4], 0.4, 0.5); bass.note(b + 2.5, low[r + 2], 0.4, 0.5); clap.pattern(b, 1, '.x.x', { vel: 0.6 }); sh.pattern(b, 0.5, 'x.xxx.xx', { vel: 0.5 }); if (bar < 4) [1, 2.5, 3.5].forEach((o, k) => mar.note(b + o, sc[r + 2 + k * 2], 0.3, 0.4)); }
    // the tumble runs downhill, then the click
    for (let k = 0; k < 8; k++) mar.note(M.b(8.3) + k * 0.25, sc[11 - k], 0.25, 0.5 - 0.03 * k);
    const L = M.b(T_LOCK); clap.hit(L, 1); kick.hit(L, 1); wb.hit(L, 1, 0.1, { pitch: 67 }); bass.note(L, 'F2', 2, 0.9); [0, 2, 4, 7, 9, 11, 14].forEach((d, k) => kal.note(L + 0.25 + k * 0.125, sc[d], 1.5, 0.6 - 0.04 * k)); mar.chord(L, [sc[0], sc[2], sc[4]], 1, 0.6);
    kal.note(M.b(12.6), 'C7', 0.5, 0.5); kal.note(M.b(12.72), 'F7', 1, 0.45); bass.note(24, 'F2', 3, 0.6); mar.chord(24, [sc[0], sc[4], sc[7]], 2, 0.4);
    return M;
  },

  setup() { ctx = Stage.canvas2d({ z: 1, dpr: 2 }); },

  frame(t) {
    const c = ctx; c.clearRect(0, 0, W, H);
    const lock = t >= T_LOCK, la = t - T_LOCK, floorA = 1 - smoothstep(9.4, 10.0, t);
    c.save(); c.translate(960, 610); c.scale(1.3, 1.3); c.translate(-960, -610);
    // floor line
    c.strokeStyle = `rgba(29,27,34,${0.14 * floorA * prog(t, 0, 0.5)})`; c.lineWidth = 2; c.beginPath(); c.moveTo(200, FLOOR + 1); c.lineTo(W - 200, FLOOR + 1); c.stroke();
    const order = t > 6.3 && t < 9.5 ? ['arch', 'circle', 'square'] : ['arch', 'square', 'circle'], P = {}; for (const n of order) P[n] = pose(n, Math.min(t, T_LOCK));
    // shadows first
    for (const n of order) { const p = P[n]; if (!p.vis || floorA <= 0) continue; const hgt = clamp01((FLOOR - p.y) / 520), w = (n === 'circle' ? 92 : n === 'arch' ? 104 : 86) * (1.05 - 0.45 * hgt); c.fillStyle = `rgba(29,27,34,${0.16 * floorA * (1 - 0.6 * hgt)})`; c.beginPath(); c.ellipse(p.x, FLOOR + 5, w, 9 * (1 - 0.4 * hgt), 0, 0, TAU); c.fill(); }
    // shapes
    const snap = lock ? 1 + 0.16 * Math.exp(-la * 9) * Math.cos(la * 26) : 1, blink = Math.exp(-Math.pow((t - 12.6) / 0.075, 2));
    for (const n of order) { const p = P[n]; if (!p.vis) continue; c.save(); c.translate(p.x, p.y);
      if (lock) { c.scale(snap, snap); if (n === 'circle') c.scale(1 + 0.1 * blink, 1 - 0.9 * blink); c.rotate(p.rot); const k = n === 'square' ? lerp(1, 0.52, E.outBack(clamp01(la / 0.25))) : n === 'circle' ? lerp(1, 1.12, E.outBack(clamp01(la / 0.25))) : 1; c.shadowColor = 'rgba(29,27,34,.16)'; c.shadowBlur = 16; c.shadowOffsetY = 8; shape(c, n, k); }
      else { const sq = t > 9.5 ? lerp(1, 1, 0) : 1; c.rotate(p.rot); c.scale(p.sx * sq, p.sy * sq); shape(c, n, 1); }
      c.restore(); }
    // the click: a ring, three sparks
    if (lock && la < 0.7) { const r = E.outCubic(la / 0.7); c.strokeStyle = `rgba(29,27,34,${0.5 * (1 - r)})`; c.lineWidth = 4 * (1 - r) + 1; c.beginPath(); c.arc(960, 430, 150 + 420 * r, 0, TAU); c.stroke(); for (let i = 0; i < 10; i++) { const a = i * TAU / 10 + 0.3, d = 330 + 190 * r; c.strokeStyle = [TOMATO, COBALT, MUSTARD][i % 3]; c.globalAlpha = 1 - r; c.lineWidth = 7; c.lineCap = 'round'; c.beginPath(); c.moveTo(960 + Math.cos(a) * d, 430 + Math.sin(a) * d * 0.62); c.lineTo(960 + Math.cos(a) * (d + 40 * (1 - r)), 430 + Math.sin(a) * (d + 40 * (1 - r)) * 0.62); c.stroke(); } c.globalAlpha = 1; }
    c.restore();
    // wordmark
    const wm = prog(t, T_LOCK + 0.35, 0.7, E.outCubic); if (wm > 0) { const word = 'OKO & VALE'; c.font = '800 104px "Bricolage Grotesque Variable"'; c.textBaseline = 'alphabetic'; c.textAlign = 'left'; const ws = word.split('').map((ch) => c.measureText(ch).width + 10), tot = ws.reduce((a, b) => a + b, 0); let x = 960 - tot / 2;
      word.split('').forEach((ch, i) => { const a = E.outBack(clamp01((t - T_LOCK - 0.35 - i * 0.045) / 0.4)); if (a > 0) { c.globalAlpha = Math.min(1, a); c.fillStyle = ch === '&' ? TOMATO : INK; c.fillText(ch, x, 766 + 36 * (1 - a)); } x += ws[i]; }); c.globalAlpha = 1;
      const tg = prog(t, T_LOCK + 1.1, 0.6, E.outCubic); c.globalAlpha = 0.72 * tg; c.fillStyle = INK; c.font = '500 28px "Bricolage Grotesque Variable"'; c.textAlign = 'center'; c.fillText('studio for moving things', 960, 826 + 8 * (1 - tg)); c.globalAlpha = 1; }
  }
});
</script>
</body>
</html>
