<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nº 005 — Ink in Water</title>
<link rel="stylesheet" href="../lib/fonts/fonts.css">
<script src="../lib/stage.js"></script>
<script src="../lib/synth.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
/* Nº 005 — INK IN WATER
 * Drops of ink blooming in still water, seen from the side against a milky backlight.
 * A small stateful fluid solver (WebGL2 feedback buffers: velocity + pressure at 640×360, dye at 1920×1080):
 * each felt-piano note is a drop — a blob of dense ink pushed in from the surface, which then sinks under its own
 * weight, rolls up and frays. Five bars at 60 bpm (4 s each): one indigo drop → two more → the plumes interleave
 * → a single vermilion drop lands centre on the downbeat of bar 4 (12.0 s) → slow settle.
 * The picture is Beer–Lambert absorption of the two dye densities over paper-white light. */
const { ease: E, clamp01, lerp, smoothstep } = Stage;
const SW = 640, SH = 360, DW = 1920, DH = 1080, DT = 1 / 60, MAXD = 8, PEAK = 12;

// one entry per piano note, in order: where it lands (0..1 across the tank), which ink, how big
const CAST = [
  { x: 0.360, ink: 0, s: 1.00 },
  { x: 0.675, ink: 0, s: 0.95 },
  { x: 0.150, ink: 0, s: 0.80 },
  { x: 0.860, ink: 0, s: 0.55 },
  { x: 0.505, ink: 1, s: 1.00 },
  { x: 0.270, ink: 0, s: 0.40 },
];

const HEAD = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vUv; out vec4 fragColor;
` + Stage.GLSL + `
const vec2 SIM = vec2(${SW}., ${SH}.); const vec2 ASP = vec2(16. / 9., 1.);
// divergence-free drift: the curl of a slow noise stream function
vec2 drift(vec2 p, float t){
  const float e = .01;
  float a = snoise(vec3(p, t)), ax = snoise(vec3(p + vec2(e, 0.), t)), ay = snoise(vec3(p + vec2(0., e), t));
  return vec2(ay - a, a - ax) / e;
}
`;
const VS = `#version 300 es
in vec2 p; out vec2 vUv; void main(){ vUv = p * .5 + .5; gl_Position = vec4(p, 0., 1.); }`;

const F_CURL = `uniform sampler2D uVel; uniform vec2 uTx;
void main(){
  float L = texture(uVel, vUv - vec2(uTx.x, 0.)).y, R = texture(uVel, vUv + vec2(uTx.x, 0.)).y;
  float T = texture(uVel, vUv + vec2(0., uTx.y)).x, B = texture(uVel, vUv - vec2(0., uTx.y)).x;
  fragColor = vec4(.5 * (R - L - T + B), 0., 0., 1.);
}`;

const F_FORCE = `uniform sampler2D uVel, uCurl, uDye; uniform vec2 uTx; uniform float uDt, uConf, uGrav, uStir, uT;
uniform int uN; uniform vec4 uA[${MAXD}], uB[${MAXD}];
void main(){
  vec2 v = texture(uVel, vUv).xy;
  float L = texture(uCurl, vUv - vec2(uTx.x, 0.)).x, R = texture(uCurl, vUv + vec2(uTx.x, 0.)).x;
  float T = texture(uCurl, vUv + vec2(0., uTx.y)).x, B = texture(uCurl, vUv - vec2(0., uTx.y)).x, C = texture(uCurl, vUv).x;
  vec2 f = .5 * vec2(abs(T) - abs(B), abs(R) - abs(L)); f /= length(f) + 1e-3; f *= uConf * C; f.y *= -1.;
  v += f * uDt;                                                   // vorticity confinement keeps the curls alive
  vec2 d = textureLod(uDye, vUv, 1.6).rg;
  v.y -= uGrav * (d.r + d.g) * uDt;                               // ink is heavier than water
  vec2 p = vUv * ASP;
  v += uStir * drift(p * 1.6, uT * .06) * uDt;                    // the water is almost, not quite, still
  for (int i = 0; i < uN; i++) {
    vec2 q = (vUv - uA[i].xy) * ASP; float g = exp(-dot(q, q) / (uA[i].z * uA[i].z));
    vec2 tv = uB[i].xy + uB[i].z * drift(p * 11. + float(i) * 7.3, uT * 1.3);
    v = mix(v, tv, clamp(g * uA[i].w, 0., 1.));                   // the falling drop drags the water with it
  }
  fragColor = vec4(v, 0., 1.);
}`;

const F_DIV = `uniform sampler2D uVel; uniform vec2 uTx;
void main(){
  vec2 C = texture(uVel, vUv).xy;
  float L = texture(uVel, vUv - vec2(uTx.x, 0.)).x, R = texture(uVel, vUv + vec2(uTx.x, 0.)).x;
  float T = texture(uVel, vUv + vec2(0., uTx.y)).y, B = texture(uVel, vUv - vec2(0., uTx.y)).y;
  if (vUv.x - uTx.x < 0.) L = -C.x; if (vUv.x + uTx.x > 1.) R = -C.x;
  if (vUv.y + uTx.y > 1.) T = -C.y; if (vUv.y - uTx.y < 0.) B = -C.y;
  fragColor = vec4(.5 * (R - L + T - B), 0., 0., 1.);
}`;

const F_PRES = `uniform sampler2D uPrs, uDiv; uniform vec2 uTx; uniform float uKeep;
void main(){
  if (uKeep >= 0.) { fragColor = vec4(texture(uPrs, vUv).x * uKeep, 0., 0., 1.); return; }
  float L = texture(uPrs, vUv - vec2(uTx.x, 0.)).x, R = texture(uPrs, vUv + vec2(uTx.x, 0.)).x;
  float T = texture(uPrs, vUv + vec2(0., uTx.y)).x, B = texture(uPrs, vUv - vec2(0., uTx.y)).x;
  fragColor = vec4((L + R + B + T - texture(uDiv, vUv).x) * .25, 0., 0., 1.);
}`;

const F_GRAD = `uniform sampler2D uPrs, uVel; uniform vec2 uTx;
void main(){
  float L = texture(uPrs, vUv - vec2(uTx.x, 0.)).x, R = texture(uPrs, vUv + vec2(uTx.x, 0.)).x;
  float T = texture(uPrs, vUv + vec2(0., uTx.y)).x, B = texture(uPrs, vUv - vec2(0., uTx.y)).x;
  vec2 v = texture(uVel, vUv).xy - .5 * vec2(R - L, T - B);
  fragColor = vec4(v, 0., 1.);
}`;

const F_ADVV = `uniform sampler2D uVel; uniform vec2 uTx; uniform float uDt, uDamp;
void main(){
  vec2 v = texture(uVel, vUv).xy;
  vec2 o = texture(uVel, vUv - uDt * v * uTx).xy * uDamp;
  fragColor = vec4(o, 0., 1.);
}`;

const F_ADVD = `uniform sampler2D uVel, uDye; uniform vec2 uTx, uDs; uniform float uDt, uSoft, uT;
uniform int uN; uniform vec4 uA[${MAXD}], uC[${MAXD}];
vec2 velAt(vec2 uv){                                              // smooth (cubic B-spline) upsample of the coarse velocity
  vec2 st = uv * SIM - .5, i = floor(st), f = st - i, f2 = f * f, f3 = f2 * f;
  vec2 w0 = (1. - 3. * f + 3. * f2 - f3) / 6., w1 = (4. - 6. * f2 + 3. * f3) / 6., w2 = (1. + 3. * f + 3. * f2 - 3. * f3) / 6., w3 = f3 / 6.;
  vec2 g0 = w0 + w1, g1 = w2 + w3, h0 = (w1 / g0) - 1. + i + .5, h1 = (w3 / g1) + 1. + i + .5;
  return g0.y * (g0.x * texture(uVel, vec2(h0.x, h0.y) / SIM).xy + g1.x * texture(uVel, vec2(h1.x, h0.y) / SIM).xy)
       + g1.y * (g0.x * texture(uVel, vec2(h0.x, h1.y) / SIM).xy + g1.x * texture(uVel, vec2(h1.x, h1.y) / SIM).xy);
}
vec2 catrom(vec2 uv){                                             // sharp (Catmull-Rom) resample so filaments survive 1200 steps
  vec2 sp = uv * uDs, t1 = floor(sp - .5) + .5, f = sp - t1;
  vec2 w0 = f * (-.5 + f * (1. - .5 * f)), w1 = 1. + f * f * (-2.5 + 1.5 * f), w2 = f * (.5 + f * (2. - 1.5 * f)), w3 = f * f * (-.5 + .5 * f);
  vec2 w12 = w1 + w2, p0 = (t1 - 1.) / uDs, p3 = (t1 + 2.) / uDs, p12 = (t1 + w2 / w12) / uDs;
  vec2 r = textureLod(uDye, vec2(p0.x, p0.y), 0.).rg * w0.x * w0.y + textureLod(uDye, vec2(p12.x, p0.y), 0.).rg * w12.x * w0.y + textureLod(uDye, vec2(p3.x, p0.y), 0.).rg * w3.x * w0.y;
  r += textureLod(uDye, vec2(p0.x, p12.y), 0.).rg * w0.x * w12.y + textureLod(uDye, vec2(p12.x, p12.y), 0.).rg * w12.x * w12.y + textureLod(uDye, vec2(p3.x, p12.y), 0.).rg * w3.x * w12.y;
  r += textureLod(uDye, vec2(p0.x, p3.y), 0.).rg * w0.x * w3.y + textureLod(uDye, vec2(p12.x, p3.y), 0.).rg * w12.x * w3.y + textureLod(uDye, vec2(p3.x, p3.y), 0.).rg * w3.x * w3.y;
  return r;
}
void main(){
  vec2 v1 = velAt(vUv), v2 = velAt(vUv - .5 * uDt * v1 * uTx);    // midpoint back-trace
  vec2 c = vUv - uDt * v2 * uTx;
  vec2 lo = textureLod(uDye, c, 0.).rg, hi = catrom(c);
  ivec2 ip = ivec2(floor(c * uDs - .5)), mxi = ivec2(uDs) - 1;
  vec2 a = texelFetch(uDye, clamp(ip, ivec2(0), mxi), 0).rg, b = texelFetch(uDye, clamp(ip + ivec2(1, 0), ivec2(0), mxi), 0).rg;
  vec2 e = texelFetch(uDye, clamp(ip + ivec2(0, 1), ivec2(0), mxi), 0).rg, g = texelFetch(uDye, clamp(ip + ivec2(1, 1), ivec2(0), mxi), 0).rg;
  hi = clamp(hi, min(min(a, b), min(e, g)), max(max(a, b), max(e, g)));
  vec2 d = mix(hi, lo, uSoft);
  for (int i = 0; i < uN; i++) {
    vec2 q = (vUv - uA[i].xy) * ASP; float gg = exp(-dot(q, q) / (uA[i].z * uA[i].z * .72));
    float n = .7 + .6 * vnoise(vUv * ASP * 90. + float(i) * 13.7 + uT * 2.);
    d += uC[i].xy * gg * n * uDt;
  }
  fragColor = vec4(max(d, 0.), 0., 1.);
}`;

const F_SHOW = `uniform sampler2D uDye; uniform vec2 uCam; uniform float uZoom, uT, uFr;
const vec3 KI = vec3(3.7, 3.25, 1.5);                             // indigo: absorbs red and green
const vec3 KV = vec3(.16, 2.9, 4.1);                              // vermilion: absorbs green and blue
vec2 squash(vec2 d){ return 2.5 * (1. - exp(-d / 2.5)); }          // the densest ink stays a deep colour, never black
void main(){
  vec2 uv = uCam + (vUv - .5) / uZoom;
  vec2 d0 = squash(texture(uDye, uv).rg);
  vec2 d1 = textureLod(uDye, uv, 2.6).rg, d2 = textureLod(uDye, uv, 4.6).rg;
  vec2 p = (vUv - .5) * ASP;
  // milky backlight: brightest a little above centre, falling to warm grey
  float r = length(p * vec2(.78, 1.) - vec2(0., .07));
  vec3 light = mix(vec3(.915, .885, .81), vec3(.56, .53, .475), smoothstep(.22, 1.18, r));
  light *= 1. + .035 * (fbm(p * 1.4 + vec2(3.1, uT * .012)) - .5);
  vec3 c = light * exp(-KI * d0.x - KV * d0.y);
  c *= exp(-(KI * d1.x + KV * d1.y) * .10) * exp(-(KI * d2.x + KV * d2.y) * .09);   // soft bloom of pigment in milky water
  c = toSRGB(c) + dither(gl_FragCoord.xy, uFr);
  fragColor = vec4(c, 1.);
}`;

// ───────────────────────── a very small WebGL2 fluid kit
let gl, P = {}, vel, prs, div, crl, dye, drops = [], fno = 0;
function initGL() {
  const canvas = Stage.canvasEl({ z: 1 });
  gl = canvas.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
  if (!gl) throw new Error('WebGL2 unavailable');
  if (!gl.getExtension('EXT_color_buffer_float') && !gl.getExtension('EXT_color_buffer_half_float')) throw new Error('float render targets unavailable');
  const compile = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error('shader: ' + gl.getShaderInfoLog(s)); return s; };
  const vs = compile(gl.VERTEX_SHADER, VS);
  const program = (frag) => { const pr = gl.createProgram(); gl.attachShader(pr, vs); gl.attachShader(pr, compile(gl.FRAGMENT_SHADER, HEAD + '\n#line 1\n' + frag)); gl.bindAttribLocation(pr, 0, 'p'); gl.linkProgram(pr); if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(pr)); return { pr, loc: {} }; };
  const quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  P = { curl: program(F_CURL), force: program(F_FORCE), div: program(F_DIV), pres: program(F_PRES), grad: program(F_GRAD), advv: program(F_ADVV), advd: program(F_ADVD), show: program(F_SHOW) };
  const target = (w, h, mips) => {
    const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
    if (mips) gl.texStorage2D(gl.TEXTURE_2D, Math.floor(Math.log2(Math.max(w, h))) + 1, gl.RGBA16F, w, h); else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mips ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    return { tex, fbo, w, h, mips };
  };
  const pair = (w, h, mips) => ({ r: target(w, h, mips), w: target(w, h, mips), swap() { const t = this.r; this.r = this.w; this.w = t; } });
  vel = pair(SW, SH); prs = pair(SW, SH); div = target(SW, SH); crl = target(SW, SH); dye = pair(DW, DH, true);
}
function run(prog, out, u) {
  gl.useProgram(prog.pr); gl.bindFramebuffer(gl.FRAMEBUFFER, out ? out.fbo : null); gl.viewport(0, 0, out ? out.w : DW, out ? out.h : DH);
  let unit = 0;
  for (const k in u) {
    const v = u[k]; let l = prog.loc[k]; if (l === undefined) l = prog.loc[k] = gl.getUniformLocation(prog.pr, k); if (l === null) continue;
    if (typeof v === 'number') gl.uniform1f(l, v);
    else if (v.tex) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, v.tex); gl.uniform1i(l, unit++); }
    else if (v.int != null) gl.uniform1i(l, v.int);
    else if (v.v4) gl.uniform4fv(l, v.v4);
    else gl.uniform2fv(l, v);
  }
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function clearAll() {
  for (const t of [vel.r, vel.w, prs.r, prs.w, div, crl, dye.r, dye.w]) { gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); }
  for (const t of [dye.r, dye.w]) { gl.bindTexture(gl.TEXTURE_2D, t.tex); gl.generateMipmap(gl.TEXTURE_2D); }
  fno = 0;
}

// the drops that are in the act of falling at time t, packed for the shaders
const uA = new Float32Array(MAXD * 4), uB = new Float32Array(MAXD * 4), uC = new Float32Array(MAXD * 4);
function falling(t) {
  let n = 0;
  for (const d of drops) {
    const u = (t - d.t) / d.T; if (u < 0 || u >= 1 || n >= MAXD) continue;
    const e = E.outCubic(u), de = 3 * (1 - u) * (1 - u) / d.T;                 // position along the plunge and its rate
    const grip = 0.96 * Math.min(1, u * 12) * Math.min(1, (1 - u) * 3.5);
    uA.set([d.x + d.sway * e, 1.03 - d.depth * e, d.r, grip], n * 4);
    uB.set([d.sway * de * SW, -d.depth * de * SH, d.turb, 0], n * 4);
    const q = d.q * Math.min(1, u * 10) * Math.pow(1 - u, 1.3);
    uC.set([d.ink ? 0 : q, d.ink ? q : 0, 0, 0], n * 4);
    n++;
  }
  return n;
}

// camera: begins close on the first drop, eases back to the whole tank for the vermilion, then leans in again
function camera(t) {
  const back = E.inOutSine(clamp01((t - 2.6) / 8.2)), lean = E.inOutSine(clamp01((t - 13.2) / 6.8));
  const zoom = lerp(1.24, 1.0, back) + 0.07 * lean;
  const cx = lerp(0.405, 0.5, back) + 0.004 * lean;
  const cy = 1 - 0.5 / zoom - 0.03 * lean * (1 - 1 / 1.07) * 14;               // anchored to the surface, then sinking a touch
  return { zoom, cx, cy: Math.max(0.5 / zoom, cy) };
}

Stage.create({
  no: 5, title: 'Ink in Water', subtitle: 'fluid feedback shader · 60 bpm',
  duration: 20, background: '#efeadf', grain: 0.05, vignette: 0, stateful: true, poster: 14.5,
  fade: { in: 0.5, out: 1.7, color: '#f1ede3' },
  slate: { at: 0.8, hold: 3.2, pos: 'bl', color: 'rgba(36,42,84,0.86)' },

  music(S) {
    const M = S.score({ bpm: 60, duration: 20, seed: 5 });
    M.master({ reverb: { decay: 6.0, size: 1.5, damp: 0.5 }, fadeIn: 0.4, fadeOut: 2.6 });
    const swell = (t) => 0.42 + 0.58 * smoothstep(1, PEAK + 1, t) - 0.5 * smoothstep(15, 20, t);
    const piano = M.track('piano', { inst: 'felt', reverb: 0.62, gain: 1.15, params: { decay: 3.4 } });
    const str = M.track('strings', { reverb: 0.6, gain: (t) => 0.8 * swell(t), params: { A: 0.9, R: 1.6, cutoff: 3000 }, lowpass: (t) => 700 + 2100 * smoothstep(3, PEAK + 1.5, t) - 1300 * smoothstep(15.5, 20, t) });
    const cel = M.track('celli', { inst: 'strings', reverb: 0.45, gain: (t) => 0.75 * swell(t), params: { A: 1.1, R: 1.8, cutoff: 1100, voices: 3, detune: 7 } });
    // harmony: Em(add9) | Cmaj7 | Am7 – Dsus | Gmaj9 (the vermilion) | Em(add9)
    str.chord(0, ['B3', 'E4', 'F#4'], 4.2, 0.42);
    str.chord(4, ['C4', 'E4', 'G4', 'B4'], 4.2, 0.5);
    str.chord(8, ['A3', 'C4', 'E4', 'G4'], 2.2, 0.55); str.chord(10, ['A3', 'D4', 'E4', 'G4'], 2.1, 0.6);
    str.chord(12, ['B3', 'D4', 'F#4', 'A4'], 4.2, 0.7);
    str.chord(16, ['B3', 'E4', 'F#4', 'G4'], 4, 0.45);
    cel.note(0, 'E2', 4.1, 0.5); cel.note(4, 'C2', 4.1, 0.55); cel.note(8, 'A1', 2.1, 0.6); cel.note(10, 'D2', 2.1, 0.62);
    cel.note(12, 'G1', 4.1, 0.75); cel.note(12, 'G2', 4.1, 0.5); cel.note(16, 'E2', 4, 0.5);
    // the piano: every note is a drop
    piano.note(0.5, 'B4', 3, 0.62);
    piano.note(4, 'G4', 3, 0.6);
    piano.note(6.5, 'E5', 3, 0.55);
    piano.note(9.5, 'D5', 2.5, 0.42);
    piano.note(PEAK, 'B5', 4, 0.8);
    piano.note(16, 'E4', 4, 0.4);
    return M;
  },

  setup() {
    initGL();
    drops = Stage.events('piano').map((ev, k) => {
      const c = CAST[k % CAST.length], s = c.s;
      return { t: ev.t, x: c.x, ink: c.ink, T: 0.55, r: 0.030 * Math.sqrt(s), depth: 0.20 * (0.55 + 0.45 * s), sway: (Stage.hash(k, 3) - 0.5) * 0.02, turb: 14, q: 30 * s };
    });
    clearAll();
  },
  reset() { clearAll(); },

  frame(t) {
    const tx = [1 / SW, 1 / SH], n = falling(t);
    const calm = smoothstep(15.5, 20, t);
    run(P.curl, crl, { uVel: vel.r, uTx: tx });
    run(P.force, vel.w, { uVel: vel.r, uCurl: crl, uDye: dye.r, uTx: tx, uDt: DT, uConf: 6, uGrav: 5.6, uStir: 0.5, uT: t, uN: { int: n }, 'uA[0]': { v4: uA }, 'uB[0]': { v4: uB } }); vel.swap();
    run(P.div, div, { uVel: vel.r, uTx: tx });
    run(P.pres, prs.w, { uPrs: prs.r, uTx: tx, uKeep: 0.9 }); prs.swap();
    for (let k = 0; k < 36; k++) { run(P.pres, prs.w, { uPrs: prs.r, uDiv: div, uTx: tx, uKeep: -1 }); prs.swap(); }
    run(P.grad, vel.w, { uPrs: prs.r, uVel: vel.r, uTx: tx }); vel.swap();
    run(P.advv, vel.w, { uVel: vel.r, uTx: tx, uDt: DT, uDamp: 1 / (1 + (0.35 + 0.5 * calm) * DT) }); vel.swap();
    run(P.advd, dye.w, { uVel: vel.r, uDye: dye.r, uTx: tx, uDs: [DW, DH], uDt: DT, uSoft: 0.12, uT: t, uN: { int: n }, 'uA[0]': { v4: uA }, 'uC[0]': { v4: uC } }); dye.swap();
    gl.bindTexture(gl.TEXTURE_2D, dye.r.tex); gl.generateMipmap(gl.TEXTURE_2D);
    const cam = camera(t);
    run(P.show, null, { uDye: dye.r, uCam: [cam.cx, cam.cy], uZoom: cam.zoom, uT: t, uFr: fno });
    fno++;
  }
});
</script>
