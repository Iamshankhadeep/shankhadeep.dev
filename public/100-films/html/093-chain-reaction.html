<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nº 093 — Chain Reaction</title>
<link rel="stylesheet" href="../lib/fonts/fonts.css">
<script src="../lib/stage.js"></script>
<script src="../lib/synth.js"></script>
<script src="../lib/vendor/three.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
/* Nº 093 — CHAIN REACTION
 * A spiral of dominoes falls from the outside in. The tiles stand at equal steps of arc length along an
 * Archimedean spiral (r = bθ); each has a trigger time, earlier for the outer ones, with the wave speeding up
 * toward the centre, and a tile's lean is just a function of (now − its trigger time) — so the whole collapse
 * is analytic: any frame can be computed on its own. Every tile is one instance of one box, hinged about its
 * leading bottom edge. The colour ramp along the spiral only really reads once they are all down. A marble
 * gives the first push; the last tile rings a bell and the key turns major. Ten bars at 120 bpm (2 s each). */
const { ease: E, prog, win, clamp01, lerp, smoothstep, hash } = Stage;
const TAU = Math.PI * 2, HT = 1.0, WD = 0.5, TH = 0.12, STEP = 0.36, GAP = 1.25, R_OUT = 9.6, R_IN = 1.05, T0 = 1.8, T_SPAN = 13.9, FALL = 0.26, LEAN = 1.22;
// the spiral, and when each tile goes
const TILES = (() => { const b = GAP / TAU, out = []; let th = R_OUT / b; while (b * th > R_IN) { const r = b * th, x = r * Math.cos(th), z = r * Math.sin(th), dx = -(b * Math.cos(th) - r * Math.sin(th)), dz = -(b * Math.sin(th) + r * Math.cos(th)), l = Math.hypot(dx, dz); out.push({ x, z, dx: dx / l, dz: dz / l }); th -= STEP / r; } out.forEach((t, i) => { t.t = T0 + T_SPAN * (1 - Math.pow(1 - i / (out.length - 1), 1.75)); }); return out; })();
const N = TILES.length, T_END = TILES[N - 1].t + FALL;
const RAMP = Stage.color.ramp(['#1f2f6e', '#1d6f8c', '#2aa79a', '#f07e63', '#f4c58f', '#f6ecd6']);
const front = (t) => { let lo = 0, hi = N - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (TILES[m].t <= t) lo = m; else hi = m - 1; } return lo; };
let T3, inst, dummy, bell, ball, hud, M4, Q;

Stage.create({
  no: 93, title: 'Chain Reaction', subtitle: N + ' dominoes, outside in · 120 bpm',
  duration: 20, background: '#0b0c10', grain: 0.04, poster: 17.6,
  fonts: ['500 13px "JetBrains Mono Variable"'],
  fade: { in: 0.8, out: 1.3 },
  slate: { at: 0.4, hold: 2.2, pos: 'bl' },

  music(S) {
    const M = S.score({ bpm: 120, duration: 20, seed: 93 });
    M.master({ reverb: { decay: 2.0, size: 0.9, damp: 0.45 }, fadeOut: 1.6 });
    const tk = M.track('tick', { reverb: 0.15, gain: 0.5, humanize: 0 }), wb = M.track('woodblock', { reverb: 0.2, gain: 0.34, humanize: 0 }), arp = M.track('arp', { reverb: 0.35, gain: 0.5, pan: 0.2, delay: { time: 0.75, fb: 0.35, mix: 0.25 }, lowpass: (t) => 800 + 5000 * smoothstep(2, 15, t) }), pad = M.track('pad', { reverb: 0.6, gain: 0.44 }), sub = M.track('sub', { reverb: 0.05, gain: 0.36 }), bell = M.track('bell', { reverb: 0.7, gain: 0.7 }), gl = M.track('glasspad', { reverb: 0.7, gain: 0.4 }), kick = M.track('softkick', { reverb: 0.06, gain: 0.5 });
    // the clicks: every tile early on, thinned as the wave outruns the ear
    let last = -1; TILES.forEach((d, i) => { const p = i / N, minGap = lerp(0.05, 0.028, p); if (d.t - last >= minGap) { last = d.t; const pan = clamp01(0.5 + d.x / 22) * 2 - 1; if (i % 2) tk.hit(M.b(d.t + FALL * 0.8), 0.32 + 0.3 * p, 0.03, { tone: 1500 + 2600 * p, pan }); else wb.hit(M.b(d.t + FALL * 0.8), 0.3 + 0.3 * p, 0.04, { pitch: 55 + 24 * p, pan }); } });
    wb.hit(M.b(T0), 0.9, 0.1, { pitch: 50 });
    const ch = [['E2', ['E3', 'G3', 'B3', 'D4']], ['C2', ['E3', 'G3', 'C4', 'D4']], ['A1', ['E3', 'A3', 'C4', 'E4']], ['B1', ['F#3', 'A3', 'B3', 'D#4']]];
    for (let bar = 0; bar < 8; bar++) { const b = bar * 4, [r, c] = ch[bar % 4]; pad.chord(b, c, 4, 0.4 + 0.02 * bar); if (bar >= 1) { sub.note(b, r, 3.7, 0.6); const dens = bar < 4 ? 0.5 : 0.25; for (let k = 0; k < 4 / dens; k++) arp.note(b + k * dens, S.midi(c[k % 4]) + 12 + 12 * Math.floor((k % 8) / 4) + (bar >= 6 ? 12 : 0), dens * 0.8, 0.34 + 0.02 * bar); if (bar >= 3) kick.pattern(b, 1, bar >= 5 ? 'xxxx' : 'x.x.', { vel: 0.7 }); } }
    // the bell: E major
    const tb = M.b(T_END); bell.note(tb, 'E5', 5, 0.8); bell.note(tb + 0.02, 'G#5', 5, 0.5); bell.note(tb + 0.04, 'B5', 5, 0.5); gl.chord(tb, ['E4', 'G#4', 'B4', 'E5'], 7, 0.5); pad.chord(tb, ['E3', 'G#3', 'B3', 'F#4'], 7, 0.5); sub.note(tb, 'E2', 6, 0.6);
    [0, 2, 4, 7].forEach((d, k) => arp.note(tb + 1 + k * 0.5, S.midi(['E5', 'G#5', 'B5', 'E6'][k]), 1, 0.4));
    return M;
  },

  setup() {
    const T = THREE; T3 = Stage.three({ fov: 34, exposure: 1.05, z: 1 }); const sc = T3.scene, rn = T3.renderer; sc.background = new T.Color('#0b0c10'); sc.fog = new T.Fog('#0b0c10', 30, 70);
    rn.shadowMap.enabled = true;
    inst = new T.InstancedMesh(new T.BoxGeometry(WD, HT, TH), new T.MeshStandardMaterial({ roughness: 0.5, metalness: 0.02 }), N); inst.castShadow = true; inst.receiveShadow = true; inst.frustumCulled = false;
    const col = new T.Color(); for (let i = 0; i < N; i++) inst.setColorAt(i, col.set(RAMP(i / (N - 1)))); sc.add(inst);
    const floor = new T.Mesh(new T.PlaneGeometry(160, 160), new T.MeshStandardMaterial({ color: '#16181e', roughness: 0.78, metalness: 0.1 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; sc.add(floor);
    sc.add(new T.HemisphereLight('#cfd8ff', '#20242e', 0.9)); const sun = new T.DirectionalLight('#fff0dc', 2.6); sun.position.set(-9, 16, 7); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); const sc2 = sun.shadow.camera; sc2.left = -13; sc2.right = 13; sc2.top = 13; sc2.bottom = -13; sc2.near = 2; sc2.far = 40; sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.02; sc.add(sun);
    const rim = new T.DirectionalLight('#7fa0ff', 0.6); rim.position.set(10, 6, -9); sc.add(rim);
    // the bell at the centre, and the marble that starts it
    bell = new T.Group(); const dome = new T.Mesh(new T.SphereGeometry(0.34, 32, 16, 0, TAU, 0, Math.PI / 2), new T.MeshStandardMaterial({ color: '#d9a94a', roughness: 0.25, metalness: 0.9, emissive: '#ffb030', emissiveIntensity: 0 })); dome.position.y = 0.18; dome.castShadow = true; bell.add(dome); const post = new T.Mesh(new T.CylinderGeometry(0.05, 0.07, 0.2, 16), new T.MeshStandardMaterial({ color: '#8a6a2a', roughness: 0.4, metalness: 0.8 })); post.position.y = 0.1; bell.add(post); bell.dome = dome;
    const lt = TILES[N - 1]; bell.position.set(lt.x + lt.dx * 0.95, 0, lt.z + lt.dz * 0.95); sc.add(bell);
    ball = new T.Mesh(new T.SphereGeometry(0.17, 32, 16), new T.MeshStandardMaterial({ color: '#f6ecd6', roughness: 0.3, metalness: 0.05 })); ball.castShadow = true; sc.add(ball);
    dummy = new T.Object3D(); M4 = new T.Matrix4(); Q = [new T.Matrix4(), new T.Matrix4(), new T.Matrix4(), new T.Matrix4()];
    hud = Stage.canvas2d({ z: 2, dpr: 2 });
  },

  frame(t) {
    const T = THREE, f = front(t);
    for (let i = 0; i < N; i++) { const d = TILES[i], tau = t - d.t; let a = 0; if (tau > 0) { const u = Math.min(1, tau / FALL); a = LEAN * u * u; if (tau > FALL) a += 0.035 * Math.exp(-(tau - FALL) * 14) * Math.sin((tau - FALL) * 40); }
      const head = Math.atan2(d.dx, d.dz); M4.makeTranslation(d.x, 0, d.z); Q[0].makeRotationY(head); Q[1].makeTranslation(0, 0, TH / 2); Q[2].makeRotationX(a); Q[3].makeTranslation(0, HT / 2, -TH / 2); M4.multiply(Q[0]).multiply(Q[1]).multiply(Q[2]).multiply(Q[3]); inst.setMatrixAt(i, M4); }
    inst.instanceMatrix.needsUpdate = true;
    // marble rolls in and taps the first tile
    const d0 = TILES[0], roll = E.inQuad(prog(t, 0.5, T0 - 0.5)), back = 2.6 * (1 - roll) + 0.24 - 0.5 * prog(t, T0, 0.5, E.outCubic) * 0; ball.position.set(d0.x - d0.dx * (back + 0.2 * prog(t, T0, 0.6, E.outCubic) * -1), 0.17, d0.z - d0.dz * (back + 0.2 * prog(t, T0, 0.6, E.outCubic) * -1)); ball.rotation.x = -roll * 9;
    // the bell rings
    const rg = t > T_END ? Math.exp(-(t - T_END) * 1.4) : 0; bell.dome.material.emissiveIntensity = 1.6 * rg; bell.rotation.z = 0.25 * rg * Math.sin((t - T_END) * 24); bell.scale.setScalar(1 + 0.12 * rg);
    // camera: low beside the first tile → rising orbit that keeps an eye on the wave front → straight down
    const cam = T3.camera, pf = TILES[Math.min(N - 1, f + 6)], rise = E.inOutSine(prog(t, 2.4, 6.5)), top = E.inOutCubic(prog(t, 13.2, 4.6));
    const r0 = Math.hypot(d0.x, d0.z), lowPos = [d0.x - d0.dx * 2.6 + d0.x / r0 * 3.0, 0.85, d0.z - d0.dz * 2.6 + d0.z / r0 * 3.0], az = 2.2 + t * 0.16, el = lerp(0.36, 1.0, smoothstep(4, 13, t)), rad = lerp(17, 23, smoothstep(4, 13, t)), orb = [Math.cos(az) * Math.cos(el) * rad, Math.sin(el) * rad, Math.sin(az) * Math.cos(el) * rad], topPos = [0.01 * Math.cos(az), 31, 0.01 * Math.sin(az)];
    const p1 = lowPos.map((v, k) => lerp(v, orb[k], rise)), p = p1.map((v, k) => lerp(v, topPos[k], top)); cam.position.set(p[0], p[1], p[2]);
    const lookF = [lerp(d0.x + d0.dx * 1.2, pf.x, smoothstep(1.6, 3.2, t)), 0.4, lerp(d0.z + d0.dz * 1.2, pf.z, smoothstep(1.6, 3.2, t))], lk = lookF.map((v, k) => lerp(v, [0, 0, 0][k], smoothstep(3.5, 10, t))); cam.up.set(lerp(0, Math.sin(-az) * 0 + 0, top), 1, 0); if (top > 0.98) cam.up.set(Math.cos(az), 0, Math.sin(az)); else cam.up.set(top * Math.cos(az) * 0.6, 1, top * Math.sin(az) * 0.6); cam.lookAt(lk[0], lk[1], lk[2]);
    T3.render();
    const c = hud; c.clearRect(0, 0, 1920, 1080); const on = prog(t, 1.0, 0.8) * (1 - prog(t, 18.6, 1)); c.font = '500 13px "JetBrains Mono Variable"'; c.textAlign = 'right'; c.textBaseline = 'alphabetic'; const fallen = t < T0 ? 0 : Math.min(N, f + 1);
    c.fillStyle = `rgba(214,220,240,${0.6 * on})`; c.fillText('F A L L E N   ' + String(fallen).padStart(3, '0') + '  /  ' + N, 1824, 992); for (let k = 0; k < 60; k++) { c.fillStyle = Stage.color.alpha(RAMP(k / 59), (k / 60 < fallen / N ? 0.95 : 0.2) * on); c.fillRect(1824 - (60 - k) * 5, 962, 4, 10); }
  }
});
</script>
</body>
</html>
