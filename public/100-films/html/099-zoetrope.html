<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nº 099 — Zoetrope</title>
<link rel="stylesheet" href="../lib/fonts/fonts.css">
<script src="../lib/stage.js"></script>
<script src="../lib/synth.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
/* Nº 099 — ZOETROPE
 * A card disc carries sixteen drawings of a leaping hare, each one sixteenth of a leap later than its
 * neighbour (the poses come from one leap function of phase). Turning slowly it is an object; faster, a blur
 * (each frame averages the disc over the angle it turned through). Then the shutter: at one and a half
 * turns a second, the disc is shown only at the instants when it has advanced exactly one sector — twenty-four
 * times a second — so the card and its rim marks stand still and every hare runs in place, landing on each
 * beat of the waltz. When the wheel slows the instants no longer match, and it is sixteen drawings again.
 * Ten bars of 3/4 at 90 bpm (2 s each), C major. */
const { ease: E, prog, win, clamp01, lerp, smoothstep, hash } = Stage;
const W = 1920, H = 1080, TAU = Math.PI * 2, R = 470, DS = 3, CARD = '#efe6d2', INK = '#17130f', RED = '#d6452c', T_LOCK = 8, T_FREE = 16, GR = 268;
const omega = (t) => (t < 4 ? 0.22 : t < 8 ? lerp(0.22, 1.5, Math.pow(smoothstep(4, 8, t), 1.3)) : t < 16 ? 1.5 : 1.5 * (1 - smoothstep(16, 19.4, t)));
const theta = (t) => { const n = 160, d = (t - T_LOCK) / n; let s = 0; for (let i = 0; i < n; i++) s += omega(T_LOCK + (i + 0.5) * d) * d; return TAU * s; };
const KF = (keys, p) => { for (let i = 1; i < keys.length; i++) if (p <= keys[i][0]) { const a = keys[i - 1], b = keys[i]; return lerp(a[1], b[1], E.inOutSine((p - a[0]) / (b[0] - a[0]))); } return keys[keys.length - 1][1]; };
let bg, ctx, disc;

// one hare, standing on the origin, at phase ph of its leap
function hare(c, ph) {
  const air = ph > 0.1 && ph < 0.9, u = clamp01((ph - 0.1) / 0.8), v = ph >= 0.9 ? (ph - 0.9) / 0.2 : (ph + 0.1) / 0.2, sq = air ? 0 : Math.sin(Math.PI * v), h = air ? 50 * 4 * u * (1 - u) : 0, ang = air ? lerp(-0.5, 0.42, E.inOutSine(u)) : lerp(0.42, -0.5, E.inOutSine(v)), st = air ? 0.14 * Math.sin(Math.PI * u) : -0.12 * sq;
  const aH = KF([[0, 0.1], [0.1, 0.95], [0.5, 1.45], [0.8, 0.3], [0.9, -0.55], [1, 0.1]], ph), aF = KF([[0, -0.15], [0.1, -1.0], [0.4, -1.35], [0.75, -1.0], [0.9, -0.3], [1, -0.15]], ph), ear = -0.8 - 0.45 * Math.sin(TAU * (ph - 0.2));
  const circ = (x, y, r) => { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }, ell = (x, y, rx, ry, a) => { c.beginPath(); c.ellipse(x, y, rx, ry, a, 0, TAU); c.fill(); };
  const leg = (jx, jy, a, L1, L2, w) => { c.lineWidth = w; const kx = jx - Math.sin(a - (L2 ? 0.55 : 0)) * L1, ky = jy + Math.cos(a - (L2 ? 0.55 : 0)) * L1; c.beginPath(); c.moveTo(jx, jy); c.lineTo(kx, ky); if (L2) c.lineTo(kx - Math.sin(a + 0.5) * L2, ky + Math.cos(a + 0.5) * L2); c.stroke(); };
  c.fillStyle = 'rgba(214,69,44,.55)'; ell(4, 3, 40 - 16 * (h / 50), 4.4 - 2 * (h / 50), 0);
  c.save(); c.translate(0, -(33 - 7 * sq) - h); c.rotate(ang); c.scale(1 + st, 1 - st * 0.8); c.fillStyle = c.strokeStyle = INK; c.lineCap = 'round'; c.lineJoin = 'round';
  leg(-20, 12, aH + 0.24, 20, 24, 7); leg(24, 10, aF - 0.22, 27, 0, 5.5);
  c.fillStyle = RED; circ(-46, -9, 9); c.fillStyle = INK; ell(0, 0, 40, 21, 0); circ(-22, 2, 23); circ(24, -2, 17);
  c.save(); c.translate(40, -14); c.rotate(-0.25 - ang * 0.5); ell(8, -4, 16, 12, -0.2); for (const [da, len] of [[0, 38], [0.3, 33]]) { c.save(); c.translate(2, -12); c.rotate(ear + da); ell(0, -len / 2, 5.6, len / 2, 0); c.restore(); } c.fillStyle = CARD; circ(13, -6, 2.5); c.restore();
  c.fillStyle = c.strokeStyle = INK; leg(-22, 13, aH, 22, 26, 9); leg(26, 11, aF, 29, 0, 7.5);
  c.restore();
}

Stage.create({
  no: 99, title: 'Zoetrope', subtitle: 'sixteen drawings, one hare · 90 bpm',
  duration: 20, background: '#1b1917', grain: 0.045, poster: 12.4,
  fonts: ['500 13px "JetBrains Mono Variable"'],
  fade: { in: 0.8, out: 1.2 },
  slate: { at: 0.5, hold: 2.6, pos: 'bl' },

  music(S) {
    const M = S.score({ bpm: 90, duration: 20, seed: 99, meter: 3 });
    M.master({ reverb: { decay: 1.8, size: 0.85, damp: 0.45 }, fadeOut: 1.4 });
    const mb = M.track('musicbox', { reverb: 0.45, gain: 0.7 }), org = M.track('organ', { reverb: 0.3, gain: 0.2, chorus: 0.5, lowpass: 2600, pan: 0.15 }), bass = M.track('pluck', { reverb: 0.15, gain: 0.85, params: { decay: 0.9, bright: 0.3 } }), wb = M.track('woodblock', { reverb: 0.2, gain: 0.3, humanize: 0 }), tk = M.track('tick', { reverb: 0.1, gain: 0.14, humanize: 0 }), cy = M.track('ride', { reverb: 0.3, gain: 0.1 });
    const bars = [['C3', ['E4', 'G4', 'C5']], ['C3', ['E4', 'G4', 'C5']], ['F2', ['F4', 'A4', 'C5']], ['G2', ['F4', 'G4', 'B4']], ['C3', ['E4', 'G4', 'C5']], ['A2', ['E4', 'A4', 'C5']], ['F2', ['F4', 'A4', 'C5']], ['G2', ['F4', 'G4', 'B4']], ['C3', ['E4', 'G4', 'C5']], ['C3', ['E4', 'G4', 'C5']]];
    bars.forEach(([r, ch], i) => { const b = i * 3; if (i >= 2 && i < 9) { bass.note(b, r, 1, 0.75); org.chord(b + 1, ch, 0.4, 0.5); org.chord(b + 2, ch, 0.4, 0.45); } else if (i < 2) bass.note(b, r, 2.5, 0.5); else { bass.note(b, r, 3, 0.7); org.chord(b, ch, 2.5, 0.5); } if (i >= 4 && i < 8) { for (let k = 0; k < 3; k++) wb.hit(b + k, k ? 0.5 : 0.8, 0.06, { pitch: k ? 64 : 57 }); cy.pattern(b, 1, 'xxx', { vel: 0.4 }); } });
    [[0, 'E5', 1], [1, 'G5', 1], [2, 'C6', 1], [3, 'B5', 1.5], [4.5, 'A5', .5], [5, 'G5', 1], [6, 'A5', 1], [7, 'C6', 1], [8, 'F6', 1], [9, 'D6', .5], [9.5, 'E6', .5], [10, 'F6', .5], [10.5, 'G6', .5], [11, 'A6', .5], [11.5, 'B6', .5],
     [12, 'E6', 1], [13, 'G6', .5], [13.5, 'E6', .5], [14, 'C6', 1], [15, 'E6', 1], [16, 'A6', .5], [16.5, 'E6', .5], [17, 'C6', 1], [18, 'F6', 1], [19, 'A6', .5], [19.5, 'F6', .5], [20, 'C6', 1], [21, 'D6', 1], [22, 'G6', .5], [22.5, 'F6', .5], [23, 'D6', .5], [23.5, 'B5', .5], [24, 'C6', 2], [26, 'G5', 1], [27, 'E5', 1.5], [28.5, 'C5', 1.5]].forEach(([b, n, d]) => mb.note(b, n, d + 0.3, 0.55));
    // the wheel: a tick each time a sector passes the pointer, until they come too fast to count
    for (let t = 0.3; t < 7.2;) { tk.hit(M.b(t), 0.5, 0.02, { tone: 2600 }); t += 1 / (16 * omega(t)); } for (let t = 16.5; t < 19.3;) { tk.hit(M.b(t), 0.5, 0.02, { tone: 2600 }); t += 1 / (16 * Math.max(0.05, omega(t))); }
    return M;
  },

  setup() {
    bg = Stage.canvas2d({ z: 1 }); ctx = Stage.canvas2d({ z: 2, dpr: 2 }); disc = Stage.buffer(R * 2 * DS, R * 2 * DS);
    const g = bg.createRadialGradient(960, 500, 200, 960, 540, 1200); g.addColorStop(0, '#2c2824'); g.addColorStop(1, '#100e0d'); bg.fillStyle = g; bg.fillRect(0, 0, W, H);
    const c = disc; c.scale(DS, DS); c.translate(R, R);
    // card
    const cg = c.createRadialGradient(-80, -120, 60, 0, 0, R); cg.addColorStop(0, '#f5eedc'); cg.addColorStop(1, '#e6dbc2'); c.fillStyle = cg; c.beginPath(); c.arc(0, 0, R, 0, TAU); c.fill();
    const r = Stage.rng(99); c.save(); c.beginPath(); c.arc(0, 0, R, 0, TAU); c.clip(); for (let i = 0; i < 9000; i++) { const a = r() * TAU, d = Math.sqrt(r()) * R; c.fillStyle = `rgba(${r() < 0.5 ? '110,84,50' : '255,252,240'},${0.03 + 0.06 * r()})`; c.fillRect(Math.cos(a) * d, Math.sin(a) * d, 1 + 2 * r(), 1); } c.restore();
    // borders: everything except the hares repeats sixteen times, so it stands still under the shutter
    const ring = (rad, w, col) => { c.strokeStyle = col; c.lineWidth = w; c.beginPath(); c.arc(0, 0, rad, 0, TAU); c.stroke(); };
    ring(R - 8, 3, INK); ring(R - 22, 9, RED); ring(R - 34, 1.2, INK); ring(GR - 12, 1.4, INK); ring(GR - 22, 6, RED); ring(GR - 34, 1.2, INK); ring(118, 2.5, INK); ring(70, 8, RED);
    for (let j = 0; j < 16; j++) { c.save(); c.rotate(j * TAU / 16 + TAU / 32);
      c.fillStyle = INK; c.beginPath(); c.arc(0, -(R - 50), 5, 0, TAU); c.fill(); c.strokeStyle = 'rgba(23,19,15,.35)'; c.lineWidth = 1; c.beginPath(); c.moveTo(0, -(GR - 4)); c.lineTo(0, -(R - 62)); c.stroke();
      c.fillStyle = INK; c.beginPath(); c.moveTo(0, -(GR - 44)); c.lineTo(12, -182); c.lineTo(0, -128); c.lineTo(-12, -182); c.closePath(); c.fill(); c.fillStyle = RED; c.beginPath(); c.arc(0, -(GR - 58), 4, 0, TAU); c.fill(); c.restore();
      c.save(); c.rotate(j * TAU / 16); c.fillStyle = RED; c.beginPath(); c.moveTo(0, -112); c.lineTo(9, -84); c.lineTo(0, -74); c.lineTo(-9, -84); c.closePath(); c.fill();
      c.strokeStyle = INK; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, GR, -Math.PI / 2 - 0.15, -Math.PI / 2 + 0.15); c.stroke(); for (let k = -2; k <= 2; k++) { c.beginPath(); c.moveTo(k * 16, -GR + 1 + Math.abs(k) * 0.9); c.lineTo(k * 16 - 3, -GR - 7 + Math.abs(k) * 0.9); c.stroke(); }
      c.translate(0, -GR); c.scale(0.86, 0.86); hare(c, ((16 - j) % 16) / 16); c.restore(); }
    c.fillStyle = INK; c.beginPath(); c.arc(0, 0, 34, 0, TAU); c.fill();
  },

  frame(t) {
    const c = ctx; c.setTransform(2, 0, 0, 2, 0, 0); c.clearRect(0, 0, W, H); c.globalAlpha = 1;
    const wz = smoothstep(9.0, 11.6, t) * (1 - smoothstep(14.4, 16.0, t)), z = 1 + 1.3 * wz, fy = lerp(540, 252, wz); c.translate(960, 540); c.scale(z, z); c.translate(-960, -fy);
    // shadow on the table
    const sg = c.createRadialGradient(978, 566, R * 0.9, 978, 566, R * 1.12); sg.addColorStop(0, 'rgba(0,0,0,.55)'); sg.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = sg; c.fillRect(960 - R * 1.3, 540 - R * 1.3, R * 2.6, R * 2.6);
    const draw = (th, a) => { c.save(); c.translate(960, 540); c.rotate(th); c.globalAlpha = a; c.drawImage(disc.canvas, -R, -R, R * 2, R * 2); c.restore(); };
    const lock = smoothstep(T_LOCK, T_LOCK + 0.5, t) * (1 - smoothstep(T_FREE, T_FREE + 0.7, t));
    if (lock < 1) { const th = theta(t), d = omega(t) * TAU / 60, n = Math.max(1, Math.min(16, Math.ceil(d / 0.012))); for (let i = 0; i < n; i++) draw(th - d * (i / n), 1 / (i + 1)); }
    if (lock > 0) { const k = Math.floor((t - T_LOCK) * 24 + 1e-6); draw(k * TAU / 16, lock); draw((k - 1) * TAU / 16, 0.16 * lock); }
    c.globalAlpha = 1;
    // the pin, and the pointer that marks where to look
    const hg = c.createRadialGradient(954, 533, 2, 960, 540, 20); hg.addColorStop(0, '#fff2c4'); hg.addColorStop(0.5, '#c9a04a'); hg.addColorStop(1, '#6e5220'); c.fillStyle = hg; c.beginPath(); c.arc(960, 540, 18, 0, TAU); c.fill(); c.fillStyle = 'rgba(0,0,0,.5)'; c.beginPath(); c.arc(960, 540, 4, 0, TAU); c.fill();
    c.fillStyle = RED; c.beginPath(); c.moveTo(960, 540 - R + 2); c.lineTo(972, 540 - R - 24); c.lineTo(948, 540 - R - 24); c.closePath(); c.fill();
    // a little less light while the shutter is working
    c.setTransform(2, 0, 0, 2, 0, 0); if (lock > 0) { c.fillStyle = `rgba(10,8,6,${0.1 * lock})`; c.fillRect(0, 0, W, H); }
    const on = prog(t, 1, 0.8) * (1 - prog(t, 18.8, 1)), msg = t < 4 ? 'T U R N I N G   ·   ¼   R E V / S' : t < T_LOCK ? 'F A S T E R  …' : t < T_FREE ? 'S H U T T E R   ·   2 4   G L I M P S E S / S   ·   O N E   S E C T O R   E A C H' : t < 19.4 ? 'S L O W I N G' : 'A T   R E S T';
    c.font = '500 13px "JetBrains Mono Variable"'; c.textAlign = 'right'; c.textBaseline = 'alphabetic'; c.fillStyle = `rgba(239,230,210,${0.62 * on})`; c.fillText(msg, W - 96, H - 84);
  }
});
</script>
