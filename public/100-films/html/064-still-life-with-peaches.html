<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nº 064 — Still Life with Peaches</title>
<link rel="stylesheet" href="../lib/fonts/fonts.css">
<script src="../lib/stage.js"></script>
<script src="../lib/synth.js"></script>
<script src="../assets/img/064-peaches.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
/* Nº 064 — STILL LIFE WITH PEACHES
 * An oil painting paints itself. The source is one generated image; the film never shows it. Instead ~16 000
 * brushstrokes are planned from it — colour sampled under the brush, direction taken from the local edge
 * (Sobel), each stroke a fan of bristle lines with tapered ends — and laid down the way a painter would:
 * big loose blocks region by region, then forms from dark to light, then small touches, the lemon's glint last.
 * A varnish of light closes it, on a Picardy third. The canvas accumulates (stateful).
 * Eight bars at 80 bpm (3 s each). */
const { ease: E, prog, win, clamp01, lerp, smoothstep, hash } = Stage;
const W = 1920, H = 1080, TAU = Math.PI * 2, PX = 470, PY = 54, PW = 1296, PH = 972;
let wall, paint, over, weave, strokes = [], next = 0, active = [], done = 0;

function plan(img) {
  const grab = (w, h, srcCanvas) => { const b = Stage.buffer(w, h); b.imageSmoothingQuality = 'high'; b.drawImage(srcCanvas || img, 0, 0, w, h); return { d: b.getImageData(0, 0, w, h).data, w, h, c: b.canvas }; };
  const F = grab(PW, PH), Mi = grab(324, 243), Lo = grab(81, 61, Mi.c);
  const col = (im, x, y) => { const ix = Math.max(0, Math.min(im.w - 1, Math.floor(x / PW * im.w))), iy = Math.max(0, Math.min(im.h - 1, Math.floor(y / PH * im.h))), i = (iy * im.w + ix) * 4; return [im.d[i], im.d[i + 1], im.d[i + 2]]; };
  const lumOf = (c) => (0.3 * c[0] + 0.59 * c[1] + 0.11 * c[2]) / 255;
  // Sobel on the mid image: edge direction and strength
  const mw = Mi.w, mh = Mi.h, L = new Float32Array(mw * mh); for (let i = 0; i < mw * mh; i++) L[i] = (0.3 * Mi.d[i * 4] + 0.59 * Mi.d[i * 4 + 1] + 0.11 * Mi.d[i * 4 + 2]) / 255;
  const GX = new Float32Array(mw * mh), GY = new Float32Array(mw * mh), MG = new Float32Array(mw * mh); let mmax = 0;
  for (let y = 1; y < mh - 1; y++) for (let x = 1; x < mw - 1; x++) { const i = y * mw + x, gx = L[i - mw + 1] + 2 * L[i + 1] + L[i + mw + 1] - L[i - mw - 1] - 2 * L[i - 1] - L[i + mw - 1], gy = L[i + mw - 1] + 2 * L[i + mw] + L[i + mw + 1] - L[i - mw - 1] - 2 * L[i - mw] - L[i - mw + 1]; GX[i] = gx; GY[i] = gy; MG[i] = Math.hypot(gx, gy); if (MG[i] > mmax) mmax = MG[i]; }
  const edge = (x, y) => { const ix = Math.max(1, Math.min(mw - 2, Math.floor(x / PW * mw))), iy = Math.max(1, Math.min(mh - 2, Math.floor(y / PH * mh))), i = iy * mw + ix; return [Math.atan2(GY[i], GX[i]) + Math.PI / 2, Math.min(1, MG[i] / (mmax * 0.45))]; };
  const r = Stage.rng(64), out = [], HAND = -0.5;
  const mk = (pass, x, y, len, wd, c, ang, key) => out.push({ pass, x, y, len, wd, c, ang, key, curve: (r() - 0.5) * 0.5, seed: Math.floor(r() * 1e6) });
  // I · underpainting: big loose blocks, region by region
  const perm = Array.from({ length: 12 }, (_, i) => i); for (let i = 11; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  for (let gy = 0; gy < 22; gy++) for (let gx = 0; gx < 29; gx++) for (let k = 0; k < (r() < 0.45 ? 2 : 1); k++) {
    const x = (gx + r()) * PW / 29, y = (gy + r()) * PH / 22, e = edge(x, y), ang = e[1] > 0.3 ? e[0] + (r() - 0.5) * 0.5 : HAND + (r() - 0.5) * 0.9;
    mk(0, x, y, 80 + 70 * r(), 34 + 24 * r(), col(Lo, x, y), ang, perm[Math.floor(x / PW * 4) + 4 * Math.floor(y / PH * 3)] + r() * 1.3);
  }
  // II · forms: medium strokes along the edges, darks before lights
  const med = (x, y) => { const e = edge(x, y), c = col(Mi, x, y); mk(1, x, y, (24 + 26 * r()) * (1 - 0.5 * e[1]), (9 + 9 * r()) * (1 - 0.45 * e[1]), c, e[1] > 0.1 ? e[0] + (r() - 0.5) * 0.3 : HAND + (r() - 0.5) * 0.7, lumOf(c) + r() * 0.22); };
  for (let gy = 0; gy < 50; gy++) for (let gx = 0; gx < 66; gx++) med((gx + r()) * PW / 66, (gy + r()) * PH / 50);
  for (let n = 0; n < 2000;) { const x = r() * PW, y = r() * PH; if (r() < 0.05 + edge(x, y)[1]) { med(x, y); n++; } }
  // III · detail: small touches where there is something to say, highlights last
  for (let n = 0; n < 9600;) { const x = r() * PW, y = r() * PH, e = edge(x, y), c = col(F, x, y), l = lumOf(c); if (r() < 0.03 + Math.pow(e[1], 0.8) + 0.6 * Math.max(0, l - 0.5)) { mk(2, x, y, 7 + 11 * r(), 2.6 + 3.2 * r(), c, e[1] > 0.06 ? e[0] + (r() - 0.5) * 0.25 : HAND + (r() - 0.5), l > 0.62 ? 1 + l : r()); n++; } }
  // IV · the lemon's glint
  const gl = []; for (let n = 0; n < 4000; n++) { const x = (0.62 + 0.19 * r()) * PW, y = (0.53 + 0.2 * r()) * PH, c = col(F, x, y); gl.push([lumOf(c), x, y, c]); } gl.sort((a, b) => b[0] - a[0]);
  gl.slice(0, 34).forEach((g, i) => mk(3, g[1], g[2], 5 + 6 * r(), 2.4 + 1.6 * r(), g[3].map((v) => Math.min(255, v * 1.08 + 8)), edge(g[1], g[2])[0], i));
  // schedule
  const span = [[0.9, 6.0], [6.0, 15.0], [15.0, 20.5], [20.6, 21.3]], dur = [0.11, 0.06, 0.035, 0.05];
  for (let p = 0; p < 4; p++) { const s = out.filter((o) => o.pass === p).sort((a, b) => a.key - b.key); s.forEach((o, i) => { o.t0 = lerp(span[p][0], span[p][1], Math.pow(i / s.length, p === 1 ? 0.85 : 1)); o.dur = dur[p]; }); }
  return out.sort((a, b) => a.t0 - b.t0);
}

// lay the part of a stroke between progress a and b
function dab(c, s, a, b) {
  const nb = Math.max(2, Math.round(s.wd / 2.4)), dx = Math.cos(s.ang), dy = Math.sin(s.ang), nx = -dy, ny = dx;
  c.lineCap = 'round'; c.lineWidth = Math.max(1.5, s.wd / nb * 1.75);
  for (let j = 0; j < nb; j++) {
    const o = (j / (nb - 1) - 0.5), h1 = hash(j, s.seed), h2 = hash(j + 50, s.seed), lf = (1 - 0.45 * o * o * 4) * (0.82 + 0.36 * h1), half = s.len / 2 * lf, sh = 1 + (h2 - 0.5) * (s.pass === 0 ? 0.2 : 0.14);
    const pt = (u) => { const q = lerp(-half, half, u) + (h1 - 0.5) * 6, bend = s.curve * (q * q) / s.len; return [s.x + dx * q + nx * (o * s.wd + bend), s.y + dy * q + ny * (o * s.wd + bend)]; };
    const p0 = pt(a), p1 = pt((a + b) / 2), p2 = pt(b);
    c.strokeStyle = `rgba(${Math.min(255, s.c[0] * sh) | 0},${Math.min(255, s.c[1] * sh) | 0},${Math.min(255, s.c[2] * sh) | 0},${s.pass === 0 ? 0.86 : 0.92})`;
    c.beginPath(); c.moveTo(p0[0], p0[1]); c.quadraticCurveTo(p1[0], p1[1], p2[0], p2[1]); c.stroke();
  }
}

Stage.create({
  no: 64, title: 'Still Life with Peaches', subtitle: 'sixteen thousand strokes · 80 bpm',
  duration: 24, background: '#211c18', grain: 0.05, poster: 21.6, stateful: true,
  fonts: ['italic 400 34px "Fraunces Variable"', '500 14px "JetBrains Mono Variable"'],
  fade: { in: 0.8, out: 1.4 },
  slate: { at: 0.7, hold: 3.0, pos: 'bl', color: 'rgba(240,228,206,.84)', margin: 72 },

  music(S) {
    const M = S.score({ bpm: 80, duration: 24, seed: 64 });
    M.master({ reverb: { decay: 3.0, size: 1.1, damp: 0.4 }, fadeOut: 2.0 });
    const gtr = M.track('guitar', { reverb: 0.35, gain: 0.8, pan: -0.2, humanize: 0.012 }), harp = M.track('harp', { reverb: 0.45, gain: 0.7, pan: 0.25 }), str = M.track('strings', { reverb: 0.55, gain: 0.32 }), sub = M.track('sub', { reverb: 0.05, gain: 0.22 });
    // a falling-fifths sequence, the last bar raised to A major
    const bars = [['A2', ['A3', 'C4', 'E4']], ['D2', ['A3', 'D4', 'F4']], ['G2', ['G3', 'B3', 'D4']], ['C3', ['G3', 'C4', 'E4']], ['F2', ['A3', 'C4', 'F4']], ['B2', ['B3', 'D4', 'F4']], ['E2', ['G#3', 'B3', 'E4']], ['A2', ['A3', 'C#4', 'E4']]];
    const mel = [[[0, 'E5', 1.5], [1.5, 'D5', 0.5], [2, 'C5', 1], [3, 'A4', 1]], [[0, 'F5', 1.5], [1.5, 'E5', 0.5], [2, 'D5', 1], [3, 'A4', 1]], [[0, 'D5', 1.5], [1.5, 'C5', 0.5], [2, 'B4', 1], [3, 'G4', 1]], [[0, 'E5', 1.5], [1.5, 'D5', 0.5], [2, 'C5', 1], [3, 'G5', 1]],
      [[0, 'A5', 1.5], [1.5, 'G5', 0.5], [2, 'F5', 1], [3, 'C5', 1]], [[0, 'D5', 1], [1, 'F5', 1], [2, 'B4', 1], [3, 'D5', 1]], [[0, 'E5', 1.5], [1.5, 'D5', 0.5], [2, 'B4', 1], [3, 'G#4', 1]], [[0, 'A4', 2], [2, 'C#5', 1], [3, 'E5', 1]]];
    bars.forEach(([root, tri], i) => {
      const b = i * 4;
      if (i < 7) { gtr.note(b, root, 2, 0.6); gtr.note(b + 2, S.midi(root) + 12, 1.5, 0.42); [tri[0], tri[1], tri[2], tri[1], tri[0], tri[2], tri[1], tri[2]].forEach((n, k) => { if (k % 4) gtr.note(b + k * 0.5, n, 0.8, 0.4); }); }
      else { [root, 'E3', ...tri, 'A4'].forEach((n, k) => gtr.note(b + k * 0.14, n, 4, 0.5)); }
      if (i >= 1) mel[i].forEach(([o, n, d]) => harp.note(b + o, n, d + 0.5, i === 7 ? 0.42 : 0.5));
      if (i >= 2) { str.chord(b, [root, ...tri].map((n) => S.midi(n) + (n === root ? 12 : 0)), 4.1, i === 7 ? 0.5 : 0.4); sub.note(b, root, 3.8, 0.5); }
    });
    return M;
  },

  async setup() {
    wall = Stage.canvas2d({ z: 1 }); paint = Stage.canvas2d({ z: 2 }); over = Stage.canvas2d({ z: 3 });
    const img = await Stage.image('064-peaches'); strokes = plan(img);
    // the wall, the canvas and its toned ground
    const c = wall, g = c.createRadialGradient(700, 300, 100, 960, 540, 1300); g.addColorStop(0, '#3a322b'); g.addColorStop(0.6, '#272220'); g.addColorStop(1, '#151210'); c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.save(); c.shadowColor = 'rgba(0,0,0,.6)'; c.shadowBlur = 50; c.shadowOffsetX = 14; c.shadowOffsetY = 26; c.fillStyle = '#5a4630'; c.fillRect(PX, PY, PW, PH); c.restore();
    c.fillStyle = '#d9cdb4'; c.fillRect(PX - 5, PY - 5, PW + 10, PH + 10);
    const u = c.createLinearGradient(PX, PY, PX + PW, PY + PH); u.addColorStop(0, '#6a4b2c'); u.addColorStop(1, '#4c351f'); c.fillStyle = u; c.fillRect(PX, PY, PW, PH);
    const r = Stage.rng(640); for (let i = 0; i < 900; i++) { c.strokeStyle = `rgba(${r() < 0.5 ? '30,18,8' : '150,110,70'},${0.05 + 0.08 * r()})`; c.lineWidth = 30 + 50 * r(); c.lineCap = 'round'; const x = PX + r() * PW, y = PY + r() * PH; c.save(); c.beginPath(); c.rect(PX, PY, PW, PH); c.clip(); c.beginPath(); c.moveTo(x, y); c.lineTo(x + 160 * (r() - 0.3), y - 90 * r()); c.stroke(); c.restore(); }
    // canvas weave, laid over everything painted
    weave = Stage.buffer(PW, PH); { const wr = Stage.rng(641); for (let y = 0; y < PH; y += 2) { weave.fillStyle = y % 4 ? `rgba(255,240,215,${0.014 + 0.02 * wr()})` : `rgba(20,10,0,${0.02 + 0.03 * wr()})`; weave.fillRect(0, y, PW, 1); } for (let x = 0; x < PW; x += 2) { weave.fillStyle = x % 4 ? `rgba(255,240,215,${0.012 + 0.018 * wr()})` : `rgba(20,10,0,${0.018 + 0.028 * wr()})`; weave.fillRect(x, 0, 1, PH); } }
  },

  reset() { next = 0; active = []; done = 0; if (paint) paint.clearRect(0, 0, W, H); },

  frame(t) {
    const c = paint; c.save(); c.beginPath(); c.rect(PX, PY, PW, PH); c.clip(); c.translate(PX, PY);
    while (next < strokes.length && strokes[next].t0 <= t) { strokes[next].p = 0; active.push(strokes[next++]); }
    const keep = [];
    for (const s of active) { const b = clamp01((t - s.t0 + 1 / 60) / s.dur); if (b > s.p) { dab(c, s, s.p, b); s.p = b; } if (b < 1) keep.push(s); }
    active = keep; c.restore();

    // weave, varnish, and the wall label
    const o = over; o.clearRect(0, 0, W, H); o.drawImage(weave.canvas, PX, PY);
    const v = prog(t, 21.2, 2.4, E.inOutSine);
    if (v > 0) {
      o.save(); o.beginPath(); o.rect(PX, PY, PW, PH); o.clip(); o.globalCompositeOperation = 'lighter';
      const bx = PX - 500 + (PW + 1000) * v, g = o.createLinearGradient(bx - 380, PY, bx + 380, PY + 300); g.addColorStop(0, 'rgba(255,236,200,0)'); g.addColorStop(0.5, 'rgba(255,236,200,.20)'); g.addColorStop(1, 'rgba(255,236,200,0)'); o.fillStyle = g; o.fillRect(PX, PY, PW, PH);
      o.globalCompositeOperation = 'overlay'; o.fillStyle = `rgba(70,40,14,${0.14 * smoothstep(0, 0.6, v)})`; o.fillRect(PX, PY, PW, PH); o.restore();
    }
    const on = prog(t, 4.0, 1.0) * (1 - prog(t, 22.8, 1.0)), pass = t < 6 ? 'underpainting' : t < 15 ? 'forms' : t < 20.6 ? 'detail' : t < 21.3 ? 'the glint' : 'varnish', num = t < 6 ? 'I' : t < 15 ? 'II' : t < 20.6 ? 'III' : t < 21.3 ? 'IV' : 'V';
    o.textBaseline = 'alphabetic'; o.textAlign = 'left'; o.font = '500 14px "JetBrains Mono Variable"'; o.fillStyle = `rgba(214,198,172,${0.55 * on})`; o.fillText(num, 74, 150);
    o.font = 'italic 400 34px "Fraunces Variable"'; o.fillStyle = `rgba(240,228,206,${0.9 * on})`; o.fillText(pass, 74, 194);
    o.font = '500 14px "JetBrains Mono Variable"'; o.fillStyle = `rgba(214,198,172,${0.55 * on})`; o.fillText('S T R O K E S   ' + String(next).padStart(5, '0'), 74, 232);
  }
});
</script>
</body>
</html>
