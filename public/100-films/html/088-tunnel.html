<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nº 088 — Tunnel</title>
<link rel="stylesheet" href="../lib/fonts/fonts.css">
<script src="../lib/stage.js"></script>
<script src="../lib/synth.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
/* Nº 088 — TUNNEL
 * Flying down an endless corridor of portal frames. The whole place is one signed-distance function,
 * ray-marched: a concrete channel, a rib every four metres with an arched opening, a wet floor that gets a
 * second, reflected march. Each rib carries a neon tube around its opening; a kick launches a band of light
 * from forty-six metres ahead that races toward the camera, lighting each rib as it passes — moving bands,
 * never a full-frame flash. At the drop the arches round out into rings; the breakdown thickens the haze;
 * and the far end opens into soft white. Camera position is the integral of a speed curve that follows the
 * arrangement. Eleven bars at 132 bpm (1.82 s each). */
const { ease: E, prog, win, clamp01, lerp, smoothstep, hash } = Stage;
const BAR = 4 * 60 / 132;
const speed = (t) => 3.2 + 5.2 * smoothstep(3.3, 4.2, t) + 5.6 * smoothstep(8.8, 9.8, t) - 9.4 * smoothstep(14.2, 15.2, t) + 5.4 * smoothstep(16.2, 17.4, t);
const zAt = (t) => { let z = 0; const n = 240; for (let i = 0; i < n; i++) z += speed((i + 0.5) / n * t) * t / n; return z; };
let sh;

const FRAG = `
uniform float uZ, uRoll, uRing, uFog, uExit, uAmb;
uniform vec4 uBand;
const float P = 4.0;
const vec3 NEON = vec3(1.0, 0.23, 0.10);
float open2(vec2 p) {
  vec2 q = abs(p - vec2(0.0, 0.1)) - vec2(2.15, 1.6) + 0.55; float box = length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - 0.55;
  return mix(box, length(p - vec2(0.0, 0.25)) - 2.0, uRing);
}
float walls(vec3 p) { float box = min(min(3.0 - abs(p.x), p.y + 1.5), 2.7 - p.y), tube = min(3.15 - length(p.xy - vec2(0.0, 0.25)), p.y + 1.5); return mix(box, tube, uRing); }
float map(vec3 p) { float zc = mod(p.z + P * 0.5, P) - P * 0.5; return min(walls(p), max(abs(zc) - 0.22, -open2(p.xy))); }
// how brightly the rib at world z = fz is lit right now
float lit(float fz) { float rel = fz - uZ, s = uAmb; for (int i = 0; i < 4; i++) { float d = rel - uBand[i]; s += 2.4 * exp(-d * d / 9.0); } return uAmb + (s - uAmb) * smoothstep(0.5, 8.0, rel); }
float tubeGlow(vec3 p, out float I) { float zc = mod(p.z + P * 0.5, P) - P * 0.5; I = lit(p.z - zc); float c = abs(open2(p.xy) + 0.07), dz = zc + 0.27; float r2 = c * c + dz * dz; return I * exp(-r2 * 5.0) / (r2 + 0.0016); }
vec3 nrm(vec3 p) { vec2 e = vec2(0.003, 0.0); return normalize(vec3(map(p + e.xyy) - map(p - e.xyy), map(p + e.yxy) - map(p - e.yxy), map(p + e.yyx) - map(p - e.yyx))); }
vec3 surf(vec3 p, vec3 n) {
  float grain = 0.86 + 0.28 * fbm(p.xz * 3.7 + p.y * 4.3), form = 0.9 + 0.1 * step(0.5, fract(p.z * 0.5)); vec3 alb = vec3(0.13, 0.135, 0.145) * grain * form, col = alb * 0.03;
  { vec3 V = normalize(vec3(0.0, 0.05, uZ) - p); float dc = length(vec3(0.0, 0.05, uZ) - p); col += alb * vec3(0.62, 0.72, 0.9) * (0.2 + 0.8 * max(dot(n, V), 0.0)) * 1.25 / (1.0 + 0.02 * dc * dc); }
  float f0 = floor(p.z / P + 0.5) * P;
  for (int k = -1; k <= 1; k++) { float fz = f0 + float(k) * P; vec3 L = vec3(p.x * 0.6, 0.9, fz - 0.4) - p; float d2 = dot(L, L); col += alb * NEON * lit(fz) * max(dot(n, normalize(L)), 0.0) * 8.0 / (1.0 + 0.3 * d2); }
  return col;
}
vec3 fogc() { return mix(vec3(0.02, 0.022, 0.03), vec3(0.96, 0.94, 0.9), uExit); }
void main() {
  vec2 uv = (vUv - 0.5) * vec2(uRes.x / uRes.y, 1.0); uv = rot(uRoll) * uv;
  vec3 ro = vec3(0.12 * sin(uZ * 0.07), 0.05 + 0.06 * sin(uZ * 0.11), uZ), rd = normalize(vec3(uv, 1.25));
  float t = 0.05 + 0.04 * hash21(gl_FragCoord.xy + float(uFrame)), glow = 0.0, I; bool hit = false; vec3 p;
  for (int i = 0; i < 96; i++) { p = ro + rd * t; float d = map(p); glow += tubeGlow(p, I) * min(d, 0.6) * 0.0036; if (d < 0.003) { hit = true; break; } t += d * 0.92; if (t > 90.0) break; }
  vec3 col = vec3(0.0);
  if (hit) { vec3 n = nrm(p); col = surf(p, n);
    if (n.y > 0.8) {                                                     // wet floor: a second, shorter look along the reflection
      vec3 rn = normalize(n + 0.05 * vec3(vnoise(p.xz * 7.0) - 0.5, 0.0, vnoise(p.zx * 7.0 + 3.0) - 0.5)), r2 = reflect(rd, rn), q; float t2 = 0.05, g2 = 0.0, I2; bool h2 = false;
      for (int i = 0; i < 44; i++) { q = p + r2 * t2; float d = map(q); g2 += tubeGlow(q, I2) * min(d, 0.6) * 0.0036; if (d < 0.01) { h2 = true; break; } t2 += d; if (t2 > 40.0) break; }
      vec3 rc = (h2 ? surf(q, nrm(q)) : vec3(0.0)) + NEON * g2; float fres = 0.25 + 0.6 * pow(1.0 - max(dot(-rd, n), 0.0), 3.0); col = mix(col, rc * exp(-t2 * 0.03), fres * (0.6 + 0.4 * vnoise(p.xz * 2.0)));
    } }
  // haze, then the tubes' own glow on top of it
  float fog = 1.0 - exp(-t * (0.022 + 0.06 * uFog)); col = mix(col, fogc(), hit ? fog : 1.0);
  col += NEON * glow * (1.0 - 0.6 * uExit) + vec3(1.0, 0.8, 0.66) * glow * glow * 0.12;
  col += fogc() * uFog * 0.25 * (0.6 + 0.4 * fbm(uv * 3.0 + vec2(0.0, uTime * 0.2)));
  // the opening at the far end
  col = mix(col, vec3(1.0, 0.98, 0.94), uExit * smoothstep(1.35, 0.0, length(uv)) * (0.35 + 0.65 * uExit));
  col = col / (1.0 + 0.22 * col); col = pow(col, vec3(0.8));
  col *= 1.0 - 0.45 * dot(vUv - 0.5, vUv - 0.5) * (1.0 - uExit);
  fragColor = vec4(col + dither(gl_FragCoord.xy, float(uFrame)), 1.0);
}`;

Stage.create({
  no: 88, title: 'Tunnel', subtitle: 'bands of light on the kick · 132 bpm',
  duration: 20, background: '#040406', grain: 0.045, poster: 11.3,
  fade: { in: 1.2, out: 1.4, outColor: '#f5f2ec' },
  slate: { at: 0.8, hold: 2.6, pos: 'bl' },

  music(S) {
    const M = S.score({ bpm: 132, duration: 20, seed: 88 });
    M.master({ reverb: { decay: 2.4, size: 1.0, damp: 0.45 }, fadeIn: 0.3, fadeOut: 1.6 });
    const kick = M.track('kick', { reverb: 0.05, gain: 0.8, humanize: 0 }), oh = M.track('ohat', { reverb: 0.12, gain: 0.2 }), acid = M.track('acid', { reverb: 0.12, gain: 0.34, lowpass: (t) => 500 + 2600 * smoothstep(6.5, 10, t) * (1 - smoothstep(14.2, 15, t)), duck: { by: 'kick', depth: 0.4 } }), reese = M.track('reese', { reverb: 0.1, gain: 0.3, lowpass: (t) => 220 + 700 * smoothstep(9, 10, t) * (1 - smoothstep(14.2, 15, t)), duck: { by: 'kick', depth: 0.55 } });
    const stab = M.track('stab', { reverb: 0.4, gain: 0.44, delay: { time: 0.75, fb: 0.4, mix: 0.3 } }), ris = M.track('riser', { reverb: 0.4, gain: 0.4 }), imp = M.track('impact', { reverb: 0.5, gain: 0.6 }), pad = M.track('pad', { reverb: 0.7, gain: (t) => 0.3 + 0.3 * smoothstep(14, 17, t) }), wind = M.track('wind', { reverb: 0.4, gain: 0.2 }), gl = M.track('glasspad', { reverb: 0.7, gain: 0.44 }), hat = M.track('hat', { reverb: 0.05, gain: 0.16 });
    pad.chord(0, ['F2', 'C3', 'Ab3', 'Eb4'], 8, 0.5); wind.hit(0, 0.5, 8);
    for (let bar = 2; bar < 8; bar++) { const b = bar * 4, drop = bar >= 5, r = bar % 2 ? 'Db1' : 'F1'; kick.pattern(b, 1, 'xxxx', { vel: 0.95 }); oh.pattern(b, 1, 'xxxx', { vel: 0.5 }, 0.5); reese.note(b, r, 3.9, 0.7); pad.chord(b, bar % 2 ? ['Db3', 'Ab3', 'F4'] : ['F3', 'C4', 'Ab4'], 4, 0.4);
      for (let i = 0; i < 16; i++) { const n = [0, 0, 12, 0, 0, 10, 0, 12, 0, 0, 7, 0, 12, 0, 3, 0][i]; if (drop || i % 2 === 0) acid.note(b + i * 0.25, S.midi(r) + 12 + n, 0.2, i % 4 === 0 ? 0.8 : 0.5); } if (drop) { hat.pattern(b, 0.25, 'x.xxx.xxx.xxx.xx', { vel: 0.4 }); stab.chord(b + 1.5, ['F3', 'Ab3', 'C4', 'Eb4'], 0.2, 0.5); if (bar % 2) stab.chord(b + 3.25, ['F3', 'Ab3', 'C4'], 0.2, 0.4); } }
    ris.hit(16, 0.9, 4); imp.hit(20, 1, 4);
    // breakdown in fog, then the opening
    pad.chord(32, ['Db3', 'Ab3', 'F4', 'C5'], 4, 0.5); wind.hit(31, 0.7, 6); pad.chord(36, ['Ab2', 'Eb3', 'C4', 'G4'], 8, 0.6); gl.chord(36, ['Ab4', 'Eb5', 'C6'], 8, 0.5); gl.chord(40, ['F4', 'C5', 'A5'], 4, 0.4); imp.hit(36, 0.4, 3);
    return M;
  },

  setup() { sh = Stage.shader({ frag: FRAG, z: 1 }); },

  frame(t) {
    const ks = (Stage.events('kick') || []).filter((e) => e.t <= t).slice(-4), band = [999, 999, 999, 999]; ks.forEach((e, i) => { band[i] = 46 - 52 * (t - e.t) / 0.85; });
    sh.draw(t, { uZ: zAt(t), uRoll: 0.16 * Math.sin(t * 0.21) + 0.05 * Math.sin(t * 0.53), uRing: E.inOutCubic(prog(t, 5 * BAR - 0.2, 1.3)), uBand: band,
      uFog: smoothstep(14.0, 15.2, t) * (1 - 0.4 * smoothstep(17, 19, t)), uExit: E.inOutSine(prog(t, 16.4, 3.4)), uAmb: 0.03 + 0.05 * smoothstep(0, 3, t) + 0.1 * smoothstep(14.4, 16, t) });
  }
});
</script>
</body>
</html>
